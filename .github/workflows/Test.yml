name: Smoke test (API)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  id-token: write  # required for OIDC -> STS AssumeRole
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      # Set these in your repo: Settings → Secrets and variables → Actions
      AWS_REGION: ${{ secrets.AWS_REGION }}           # e.g. eu-west-3
      API_BASE_URL: ${{ vars.API_BASE_URL }}          # e.g. https://api.mlopstheotiste.fr (preferred)
      API_GW_ID: ${{ vars.API_GW_ID }}                # fallback if no custom domain
      API_STAGE: ${{ vars.API_STAGE }}                # e.g. prod
      TIMEOUT_S: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }} # arn:aws:iam::123456789012:role/GitHubActionsOIDC
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve BASE_URL
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="${API_BASE_URL:-}"
          if [ -z "${BASE_URL}" ] && [ -n "${API_GW_ID:-}" ] && [ -n "${API_STAGE:-}" ]; then
            BASE_URL="https://${API_GW_ID}.execute-api.${AWS_REGION}.amazonaws.com/${API_STAGE}"
          fi
          if [ -z "${BASE_URL}" ]; then
            # Last resort: try to discover the HTTP API endpoint by name (adjust the name if needed)
            API_ENDPOINT=$(aws apigatewayv2 get-apis --query "items[?Name=='mlops-dev-serverless']|[0].ApiEndpoint" --output text || true)
            if [ -n "${API_ENDPOINT}" ] && [ "${API_ENDPOINT}" != "None" ]; then
              STAGE="${API_STAGE:-prod}"
              BASE_URL="${API_ENDPOINT}/${STAGE}"
            fi
          fi
          if [ -z "${BASE_URL}" ]; then
            echo "::error::BASE_URL could not be resolved. Set repo variable API_BASE_URL or vars API_GW_ID and API_STAGE."
            exit 1
          fi
          echo "BASE_URL=${BASE_URL}" | tee -a "$GITHUB_ENV"
          echo "base_url=${BASE_URL}" >> "$GITHUB_OUTPUT"

      - name: Show target
        run: echo "Testing $BASE_URL"

      - name: Build payload
        shell: bash
        run: |
          set -euo pipefail
          cat > payload.json <<'JSON'
          [17.99,10.38,122.8,1001.0,0.1184,0.2776,0.3001,0.1471,0.2419,0.07871,1.095,0.9053,8.589,153.4,0.006399,0.04904,0.05373,0.01587,0.03003,0.006193,25.38,17.33,184.6,2019.0,0.1622,0.6656,0.7119,0.2654,0.4601,0.1189]
          JSON
          jq . payload.json

      - name: /health (public)
        shell: bash
        run: |
          set -euo pipefail
          CODE=$(curl -sS -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time $TIMEOUT_S "$BASE_URL/health")
          echo "HTTP $CODE"
          test "$CODE" = "200"
          
      - name: Install awscurl
        run: |
          python3 -m pip install --upgrade --user awscurl
          echo "$HOME/.local/bin" >> $GITHUB_PATH
  

      - name: /health (SigV4 via curl)
        shell: bash
        run: |
          set -euo pipefail
          CODE=$(curl -sS --fail -o /dev/null -w "%{http_code}" \
            --connect-timeout 10 --max-time $TIMEOUT_S             --aws-sigv4 "aws:amz:${AWS_REGION}:execute-api" \
            -H "X-Amz-Content-Sha256: UNSIGNED-PAYLOAD" \
            "$BASE_URL/health")
          echo "HTTP $CODE"
          test "$CODE" = "200"

      - name: /predict (SigV4 via awscurl)
        shell: bash
        run: |
          set -euo pipefail
          awscurl --service execute-api --region "$AWS_REGION" \
            -X POST -H "Content-Type: application/json" \
            --data "@payload.json" \
            "$BASE_URL/predict" | tee predict.json
          test -s predict.json

name: Deploy-Serverless-OIDC (Serverless v4 + OIDC)

on:
  workflow_dispatch:
    inputs:
      stage:  { description: "dev|prod", default: "dev", required: true }
      region: { description: "AWS region", default: "eu-west-3", required: true }
  push:
    branches: ["main"]

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-oidc-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Fallbacks valables pour push/dispatch
      AWS_REGION: ${{ inputs.region || vars.AWS_REGION || 'eu-west-3' }}
      STAGE:      ${{ inputs.stage  || vars.STAGE      || 'dev' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Serverless (v4)
        run: |
          npm i -g serverless@4
          serverless --version

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm i; fi
          npx serverless plugin list || true

      - name: Debug OIDC claims
       
        run: |
          set -euo pipefail
          URL="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com"
          TOK=$(curl -s -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$URL" | jq -r .value)
          IFS='.' read -r h p s <<<"$TOK"
          echo "---- OIDC payload ----"
          echo "$p" | base64 -d 2>/dev/null | jq -C .
    

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}   # arn:aws:iam::XXXX:role/...
          aws-region:     ${{ env.AWS_REGION }}         # <-- Fallback appliqué ici
          audience: sts.amazonaws.com

      - name: Deploy
        env:
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
          SLS_ORG: ${{ vars.SLS_ORG }}   # optionnel si défini dans serverless.yml
          SLS_APP: ${{ vars.SLS_APP }}   # optionnel
        run: |
          set -euo pipefail
          EXTRA=""
          [ -n "${SLS_ORG:-}" ] && EXTRA="$EXTRA --org ${SLS_ORG}"
          [ -n "${SLS_APP:-}" ] && EXTRA="$EXTRA --app ${SLS_APP}"
          serverless deploy --stage "$STAGE" --region "$AWS_REGION" $EXTRA
          serverless info   --stage "$STAGE" --region "$AWS_REGION" $EXTRA

name: UI → S3 + Invalidation CF

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'ui/**'
      - '.github/workflows/ui-amplify-api.yml'

concurrency:
  group: ui-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write    # OIDC pour assumer le rôle AWS
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'eu-west-3' }}
  S3_BUCKET:  ${{ vars.UI_BUCKET || secrets.UI_BUCKET }}
  CF_DIST_ID: ${{ vars.CF_DIST_ID || secrets.CF_DIST_ID }}
  UI_API_BASE: ${{ vars.API_BASE || secrets.API_BASE }}   # ex: https://xxxxx.execute-api.eu-west-3.amazonaws.com/dev
  UI_INDEX:    ${{ vars.UI_INDEX || 'form_validated.html' }}

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check inputs
        run: |
          set -euo pipefail
          test -n "${S3_BUCKET:-}"  || { echo "::error::Missing S3 bucket (UI_S3_BUCKET)"; exit 1; }
          test -n "${UI_API_BASE:-}" || { echo "::error::Missing UI_API_BASE"; exit 1; }
          echo "Region=${AWS_REGION}"
          echo "Bucket=${S3_BUCKET}"
          echo "UI_API_BASE=${UI_API_BASE}"
          echo "UI_INDEX=${UI_INDEX}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # génère config.json attendu par l'UI
      - name: Build ui/config.json
        working-directory: ui
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          cfg = {
            "api_base": os.environ["UI_API_BASE"].rstrip("/"),
            "index":    os.environ.get("UI_INDEX","form_validated.html")
          }
          with open("config.json","w",encoding="utf-8") as f:
              json.dump(cfg,f,ensure_ascii=False,indent=2)
          print("---- ui/config.json ----")
          print(json.dumps(cfg,indent=2,ensure_ascii=False))
          PY

      # upload propre + headers corrects (HTML/JSON non mis en cache)
      - name: Sync UI to S3
        run: |
          set -euo pipefail
          aws s3 sync ./ui "s3://${S3_BUCKET}/" --delete --only-show-errors
          # remplace les métadonnées pour html/json afin d'éviter le cache agressif
          aws s3 cp "s3://${S3_BUCKET}/" "s3://${S3_BUCKET}/" \
            --recursive --exclude "*" --include "*.html" --include "*.json" \
            --metadata-directive REPLACE --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html"

      - name: Optional CloudFront invalidation
        if: env.CF_DIST_ID != ''
        run: |
          set -euo pipefail
          aws cloudfront create-invalidation \
            --distribution-id "${CF_DIST_ID}" \
            --paths "/*" >/dev/null
          echo "CloudFront invalidation requested."

      - name: Summary
        run: |
          echo "✅ UI déployée sur s3://${S3_BUCKET}" >> $GITHUB_STEP_SUMMARY
          if [ -n "${CF_DIST_ID:-}" ]; then
            echo "⚡ Invalidation CloudFront: ${CF_DIST_ID}" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- API base pour l'UI: ${UI_API_BASE}" >> $GITHUB_STEP_SUMMARY

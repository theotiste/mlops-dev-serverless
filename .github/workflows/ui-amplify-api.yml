name: Deploy UI (Amplify API)

on:
  push:
    branches: [ main ]
    paths:
      - 'ui/**'
      - '.github/workflows/ui-amplify-api.yml'
  workflow_dispatch: {}

# Annule la run précédente si une nouvelle arrive sur la même ref
concurrency:
  group: amplify-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write     # pour OIDC si tu utilises un rôle IAM
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vérif des secrets requis
        if: ${{ !secrets.AMPLIFY_APP_ID || !secrets.AMPLIFY_BRANCH || !secrets.AWS_REGION }}
        run: |
          echo "::error::Il manque au moins un secret requis: AMPLIFY_APP_ID / AMPLIFY_BRANCH / AWS_REGION"
          exit 1

      # ---------- Option 1 : OIDC (recommandé) ----------
      - name: Configure AWS creds (OIDC + IAM Role)
        if: ${{ secrets.AWS_ROLE_TO_ASSUME != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      # ---------- Option 2 : Access Keys ----------
      - name: Configure AWS creds (Access Keys)
        if: ${{ secrets.AWS_ROLE_TO_ASSUME == '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Installer AWS CLI v2
        uses: unfor19/install-aws-cli-action@v1
        with:
          version: '2'

      # (Facultatif) Met à jour des variables d'env côté branche Amplify
      - name: Mettre à jour les variables d'env de la branche (optionnel)
        if: ${{ secrets.UI_API_BASE != '' || secrets.UI_INDEX != '' }}
        env:
          APP_ID: ${{ secrets.AMPLIFY_APP_ID }}
          BRANCH: ${{ secrets.AMPLIFY_BRANCH }}
          API_BASE: ${{ secrets.UI_API_BASE }}
          UI_INDEX: ${{ secrets.UI_INDEX }}
        run: |
          set -euo pipefail
          KV=()
          if [ -n "${API_BASE:-}" ]; then KV+=(API_BASE="$API_BASE"); fi
          if [ -n "${UI_INDEX:-}" ]; then KV+=(UI_INDEX="$UI_INDEX"); fi
          if [ ${#KV[@]} -gt 0 ]; then
            aws amplify update-branch \
              --app-id "$APP_ID" \
              --branch-name "$BRANCH" \
              --environment-variables "${KV[@]}"
          else
            echo "Aucune variable à mettre à jour."
          fi

      - name: Déclencher build/deploy Amplify
        env:
          APP_ID: ${{ secrets.AMPLIFY_APP_ID }}
          BRANCH: ${{ secrets.AMPLIFY_BRANCH }}
          JOB_TYPE: ${{ secrets.AMPLIFY_JOB_TYPE || 'RELEASE' }}
        run: |
          set -euo pipefail
          echo "Start Amplify job: app=$APP_ID, branch=$BRANCH, type=$JOB_TYPE"
          aws amplify start-job \
            --app-id "$APP_ID" \
            --branch-name "$BRANCH" \
            --job-type "$JOB_TYPE"

      - name: Attendre la fin du job Amplify
        env:
          APP_ID: ${{ secrets.AMPLIFY_APP_ID }}
          BRANCH: ${{ secrets.AMPLIFY_BRANCH }}
        run: |
          set -euo pipefail
          echo "Attente de la fin du job Amplify…"
          ATTEMPTS=0
          MAX=60   # 60 * 30s ≈ 30 minutes
          while :; do
            STATUS=$(aws amplify list-jobs --app-id "$APP_ID" --branch-name "$BRANCH" --max-results 1 | jq -r '.jobSummaries[0].status')
            JOBID=$(aws amplify list-jobs --app-id "$APP_ID" --branch-name "$BRANCH" --max-results 1 | jq -r '.jobSummaries[0].jobId')
            echo "Job $JOBID → $STATUS"
            case "$STATUS" in
              SUCCEED) exit 0 ;;
              FAILED|CANCELLED) echo "::error::Amplify job $JOBID terminé avec statut $STATUS"; exit 1 ;;
            esac
            ATTEMPTS=$((ATTEMPTS+1))
            if [ $ATTEMPTS -ge $MAX ]; then
              echo "::error::Timeout après $(($MAX*30/60)) minutes."
              exit 1
            fi
            sleep 30
          done

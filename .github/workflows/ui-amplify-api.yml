# .github/workflows/ui-amplify-api.yml
name: UI → S3 + Invalidation CF

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "ui/**"
      - ".github/workflows/ui-amplify-api.yml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION:    ${{ vars.AWS_REGION    || secrets.AWS_REGION    || 'eu-west-3' }}
  S3_BUCKET:     ${{ vars.S3_BUCKET     || secrets.S3_BUCKET     }}
  CF_DISTR_ID:   ${{ vars.CF_DISTR_ID   || secrets.CF_DISTR_ID   }}
  UI_BASE:       ${{ vars.UI_BASE       || secrets.UI_BASE       }}  # https://form.mlopstheotiste.fr
  API_BASE:      ${{ vars.API_BASE      || secrets.API_BASE      }}  # https://api.mlopstheotiste.fr
  UI_PREFIX:     public/   # on sert depuis s3://<bucket>/public/

jobs:
  ui-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required inputs
        run: |
          set -euo pipefail
          test -n "${S3_BUCKET:-}"   || { echo "::error::Missing S3_BUCKET"; exit 1; }
          test -n "${CF_DISTR_ID:-}" || { echo "::error::Missing CF_DISTR_ID"; exit 1; }
          test -n "${UI_BASE:-}"     || { echo "::warning::UI_BASE not set (used only for info)"; }
          test -n "${API_BASE:-}"    || { echo "::warning::API_BASE not set (config.json)"; }

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure ui/ folder exists
        run: |
          set -euo pipefail
          mkdir -p ui
          # Si tu génères le HTML ailleurs, copie/compile ici avant le sync.

      - name: Write/patch config.json
        run: |
          set -euo pipefail
          cat > ui/config.json <<JSON
          {
            "api_base": "${API_BASE}",
            "index": "form_validated.html"
          }
          JSON
          jq . ui/config.json

      - name: Sync UI to S3 (to prefix "${{ env.UI_PREFIX }}")
        run: |
          set -euo pipefail
          aws s3 sync ui/ "s3://${S3_BUCKET}/${UI_PREFIX}" --delete

          # Forcer les bons Content-Type pour les fichiers critiques
          aws s3 cp "ui/config.json" "s3://${S3_BUCKET}/${UI_PREFIX}config.json" \
            --metadata-directive REPLACE --content-type application/json

          # (optionnel) No-cache sur le HTML si tu veux voir les changements instantanément
          aws s3 cp "ui/form_validated.html" "s3://${S3_BUCKET}/${UI_PREFIX}form_validated.html" \
            --metadata-directive REPLACE --content-type text/html --cache-control "no-cache"

          aws s3 cp "ui/result.html" "s3://${S3_BUCKET}/${UI_PREFIX}result.html" \
            --metadata-directive REPLACE --content-type text/html --cache-control "no-cache"

      - name: Invalidate CloudFront
        run: |
          set -euo pipefail
          aws cloudfront create-invalidation \
            --distribution-id "${CF_DISTR_ID}" \
            --paths "/form_validated.html" "/result.html" "/config.json"

      - name: Summary
        run: |
          echo "✅ UI déployée sur s3://${S3_BUCKET}/${UI_PREFIX}" >> $GITHUB_STEP_SUMMARY
          echo "🌐 UI: ${UI_BASE}" >> $GITHUB_STEP_SUMMARY
          echo "🔗 API base pour l'UI: ${API_BASE}" >> $GITHUB_STEP_SUMMARY

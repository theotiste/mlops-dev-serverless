name: UI → Amplify

on:
  push:
    branches: [ main ]
    paths:
      - 'ui/**'
      - '.github/workflows/ui-amplify-api.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    # Expose les secrets en variables d'environnement
    env:
      # Amplify
      AMPLIFY_WEBHOOK_URL: ${{ secrets.AMPLIFY_WEBHOOK_URL }}  # si tu utilises le webhook
      AMPLIFY_APP_ID:      ${{ secrets.AMPLIFY_APP_ID }}        # si tu utilises la CLI en fallback
      AMPLIFY_BRANCH:      ${{ secrets.AMPLIFY_BRANCH }}
      AWS_REGION:          ${{ secrets.AWS_REGION }}
      AWS_ROLE_ARN:        ${{ secrets.AWS_ROLE_TO_ASSUME }}

      # Variables pour générer/patcher ui/config.json
      UI_API_BASE: ${{ secrets.UI_API_BASE }}
      UI_INDEX:    ${{ secrets.UI_INDEX }}

    steps:
      - uses: actions/checkout@v4

      # (optionnel) Vérif visuelle
      - name: Debug env
        run: |
          echo "UI_INDEX=$UI_INDEX"
          if [ -n "$AMPLIFY_WEBHOOK_URL" ]; then echo "Webhook: present"; else echo "Webhook: none"; fi

          

      - name: Patch ui/config.json
        working-directory: ui
        run: |
          set -euo pipefail
          have_jq=false
          
          if command -v jq >/dev/null 2>&1; then have_jq=true; fi

          if [ "${have_jq}" = "true" ] && [ -f config.json ]; then
          # Met à jour un fichier existant
            tmp=$(mktemp)
            jq --arg api "$UI_API_BASE" --arg index "$UI_INDEX" \
            '.api_base=$api | .index=$index' config.json > "$tmp"
            mv "$tmp" config.json

          elif [ "${have_jq}" = "true" ]; then
          # Crée un nouveau fichier propre
            jq -n --arg api "$UI_API_BASE" --arg index "$UI_INDEX" \
            '{api_base:$api, index:$index}' > config.json

          else
          # Fallback sans jq (pas de here-doc → pas d’erreur d’indentation/CRLF)
            python3 - <<'PY'
            import json, os, sys
            data = {
              "api_base": os.environ.get("UI_API_BASE",""),
              "index": os.environ.get("UI_INDEX","")
            }
            open("config.json","w", encoding="utf-8").write(
            json.dumps(data, indent=2, ensure_ascii=False)
            )
            PY
          fi

          echo "config.json généré :"
          cat config.json
    


      # ---- Méthode A : Webhook (la plus simple) ----
      - name: Trigger Amplify via Webhook
        if: ${{ env.AMPLIFY_WEBHOOK_URL != '' }}
        run: |
          curl -s -X POST \
            -H "Content-Type: application/json" \
            -d '{"trigger":"github-actions"}' \
            "$AMPLIFY_WEBHOOK_URL"

      # ---- Méthode B : CLI Amplify (fallback si pas de webhook) ----
      - name: Configure AWS credentials
        if: ${{ env.AMPLIFY_WEBHOOK_URL == '' && env.AMPLIFY_APP_ID != '' && env.AMPLIFY_BRANCH != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region:     ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}

      - name: Start Amplify job (RELEASE)
        if: ${{ env.AMPLIFY_WEBHOOK_URL == '' && env.AMPLIFY_APP_ID != '' && env.AMPLIFY_BRANCH != '' }}
        run: |
          aws amplify start-job \
            --app-id "$AMPLIFY_APP_ID" \
            --branch-name "$AMPLIFY_BRANCH" \
            --job-type RELEASE

nname: UI → S3 + Invalidation CF

on:
  push:
    branches: [ main ]
    paths:
      - 'ui/**'
      - '.github/workflows/ui-amplify-api.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'eu-west-3' }}
  UI_BUCKET:  ${{ secrets.UI_BUCKET }}
  CF_DISTRIBUTION_ID: ${{ secrets.CF_DISTRIBUTION_ID }}
  UI_API_BASE: ${{ secrets.UI_API_BASE }}                 # ex: https://api.mlopstheotiste.fr
  UI_INDEX:    ${{ secrets.UI_INDEX || 'form_validated.html' }}

jobs:
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build ui/config.json
        working-directory: ui
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          cfg = {
              "api_base": os.environ.get("UI_API_BASE", ""),
              "index":    os.environ.get("UI_INDEX", "form_validated.html"),
          }
          with open("config.json", "w", encoding="utf-8") as f:
              json.dump(cfg, f, ensure_ascii=False, indent=2)
          PY
          echo '---- ui/config.json ----'
          cat config.json

      - name: Sync to S3
        run: |
          set -euo pipefail
          aws s3 sync ui/ "s3://${UI_BUCKET}/public/" \
            --delete \
            --cache-control "no-cache"

      - name: Invalidate CloudFront (HTML + config)
        if: env.CF_DISTRIBUTION_ID != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CF_DISTRIBUTION_ID" \
            --paths "/config.json" "/form_validated.html" "/result.html"

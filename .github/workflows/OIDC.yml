name: Smoke (OIDC minimal)

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Base URL (ex: https://api.mlopstheotiste.fr)"
        required: true
      region:
        description: "AWS region"
        default: "eu-west-3"
        required: true

permissions:
  id-token: write   # jeton OIDC
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}   # arn:aws:iam::...:role/...
          aws-region: ${{ inputs.region }}
          audience: sts.amazonaws.com

      - name: Build payload
        run: |
          cat > payload.json <<'JSON'
          {"features":[14.5,20.1,95.5,700.0,0.10,0.11,0.08,0.05,0.18,0.060,0.50,1.10,3.50,40.0,0.006,0.020,0.025,0.010,0.020,0.003,16.5,22.1,110.0,900.0,0.13,0.18,0.20,0.12,0.28,0.08]}
          JSON

      - name: /health (public)
        run: |
          set -euo pipefail
          curl -fsS -i --connect-timeout 10 --max-time 20 \
            "${{ inputs.api_base_url }}/health" | tee /tmp/health.txt
          grep -Eq '^HTTP/([0-9.]+) 200' /tmp/health.txt

      - name: /predict (SigV4 via curl)
        env:
          AWS_REGION: ${{ inputs.region }}
        run: |
          set -euo pipefail
          curl -fsS -i \
            --aws-sigv4 "aws:amz:${AWS_REGION}:execute-api" \
            -H "Content-Type: application/json" \
            --data-binary @payload.json \
            "${{ inputs.api_base_url }}/predict" | tee /tmp/predict.txt
          grep -Eq '^HTTP/([0-9.]+) 200' /tmp/predict.txt
          # Si besoin (certains domaines custom/API GW) :
          # curl -fsS -i --aws-sigv4 "aws:amz:${AWS_REGION}:execute-api" \
          #   -H "Host: $(echo "${{ inputs.api_base_url }}" | sed -E 's#https?://([^/]+)/?.*#\1#')" \
          #   -H "Content-Type: application/json" --data-binary @payload.json \
          #   "${{ inputs.api_base_url }}/predict" | tee /tmp/predict.txt && \
          #   grep -Eq '^HTTP/([0-9.]+) 200' /tmp/predict.txt

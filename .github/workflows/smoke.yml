name: Smoke tests (UI + API, IAM + SigV4)

on:
  workflow_dispatch:
    inputs:
      api_id:
        description: "ID REST API Gateway (ex: elh9s0fhdk)"
        required: true
      api_stage:
        description: "Stage de l'API (ex: dev)"
        default: "dev"
        required: true
      aws_region:
        description: "Région AWS (ex: eu-west-3)"
        default: "eu-west-3"
        required: true
      # Optionnel : domaine personnalisé pour l’API (sinon = execute-api.*)
      api_domain:
        description: "Domaine personnalisé de l’API (ex: api.mlopstheotiste.fr)"
        required: false
  push:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

concurrency:
  group: smoke-${{ github.ref_name }}
  cancel-in-progress: true

env:
  # Valeurs par défaut (surchargées par workflow_dispatch)
  API_ID: ${{ inputs.api_id || 'elh9s0fhdk' }}
  API_STAGE: ${{ inputs.api_stage || 'dev' }}
  AWS_REGION: ${{ inputs.aws_region || 'eu-west-3' }}
  API_DOMAIN: ${{ inputs.api_domain || '' }}

# Prérequis: rôle IAM OIDC avec la trust policy GitHub et la policy execute-api:Invoke
# + base path mapping sur api.mlopstheotiste.fr -> API elh9s0fhdk / stage dev

jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::<ACCOUNT_ID>:role/GHA-Smoke-Role
          aws-region: eu-west-3

      - name: Install curl with SigV4
        run: |
          sudo apt-get update -y
          sudo apt-get install -y curl jq
          curl --version | head -1
          # si l’option --aws-sigv4 n’est pas là, installe le binaire Homebrew:
          if ! curl --help all 2>/dev/null | grep -q -- '--aws-sigv4'; then
            /bin/bash -lc "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
            echo 'eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"' >> $GITHUB_ENV
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
            brew install curl
            echo "CURL=/home/linuxbrew/.linuxbrew/opt/curl/bin/curl" >> $GITHUB_ENV
          else
            echo "CURL=curl" >> $GITHUB_ENV
          fi

      - name: Build payload
        run: |
          cat > payload.json <<'JSON'
          {"features":[14.5,20.1,95.5,700.0,0.10,0.11,0.08,0.05,0.18,0.060,0.50,1.10,3.50,40.0,0.006,0.020,0.025,0.010,0.020,0.003,16.5,22.1,110.0,900.0,0.13,0.18,0.20,0.12,0.28,0.080]}
          JSON

      - name: Health (SigV4)
        env:
          CURL: ${{ env.CURL }}
        run: |
          set -euo pipefail
          $CURL -sS --fail \
            --aws-sigv4 "aws:amz:eu-west-3:execute-api" \
            "https://api.mlopstheotiste.fr/health" | jq -e '.ok==true'

      - name: Predict (SigV4)
        env:
          CURL: ${{ env.CURL }}
        run: |
          set -euo pipefail
          out=$($CURL -sS --fail \
            --aws-sigv4 "aws:amz:eu-west-3:execute-api" \
            -H "Content-Type: application/json" \
            --data-binary @payload.json \
            "https://api.mlopstheotiste.fr/predict")
          echo "$out" | jq -e '.predictions and .probabilities'
          echo "Response: $out"
  

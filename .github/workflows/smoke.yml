# .github/workflows/smoke.yml
name: Smoke tests (UI + API)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  workflow_run:
    workflows: ["UI → S3 + Invalidation CF"]
    types: [completed]

concurrency:
  group: smoke-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION:   ${{ vars.AWS_REGION   || secrets.AWS_REGION   || 'eu-west-3' }}
  API_BASE:     ${{ vars.API_BASE     || secrets.API_BASE     }}
  UI_BASE:      ${{ vars.UI_BASE      || secrets.UI_BASE      }}
  API_HEALTH_PATH:  /health
  API_PREDICT_PATH: /predict
  USE_SIGV4:    ${{ vars.USE_SIGV4 || 'true' }}
  UA: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"

jobs:
  smoke:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check required inputs
        run: |
          set -euo pipefail
          test -n "${API_BASE:-}" || { echo "::error::Missing API_BASE (secret/var)"; exit 1; }
          test -n "${UI_BASE:-}"  || { echo "::error::Missing UI_BASE  (secret/var)"; exit 1; }
          echo "API_BASE=${API_BASE}"
          echo "UI_BASE=${UI_BASE}"
          echo "AWS_REGION=${AWS_REGION}"

      - name: Configure AWS credentials (OIDC) for SigV4
        if: env.USE_SIGV4 == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y jq

      # ---------------- API ----------------
      - name: API /health (try anonymous then SigV4)
        run: |
          set -euo pipefail
          URL="${API_BASE%/}${API_HEALTH_PATH}"
          echo "GET $URL"
          code=$(curl -sS -m 25 -A "$UA" -w "%{http_code}" -o /tmp/health.json "$URL" || true)
          if [ "$code" != "200" ] && [ "${USE_SIGV4}" = "true" ]; then
            echo "Anonymous failed ($code) → retry with SigV4"
            code=$(curl -sS -m 25 -A "$UA" -w "%{http_code}" -o /tmp/health.json \
                   --aws-sigv4 "aws:amz:${AWS_REGION}:execute-api" "$URL" || true)
          fi
          test "$code" = "200" || { echo "::error::HTTP $code on /health"; cat /tmp/health.json || true; exit 1; }
          cat /tmp/health.json
          # Si JSON, valider (tolère non-JSON)
          jq -e . /tmp/health.json >/dev/null 2>&1 || true

      - name: Build smoke payload (30 floats)
        run: |
          set -euo pipefail
          cat > /tmp/payload.json <<'JSON'
          {
            "features": [
              14.5, 20.1, 95.5, 700.0, 0.10, 0.11, 0.08, 0.05, 0.18, 0.060,
              0.50, 1.10, 3.50, 40.0, 0.006, 0.020, 0.025, 0.010, 0.020, 0.003,
              16.5, 22.1, 110.0, 900.0, 0.13, 0.18, 0.20, 0.12, 0.28, 0.080
            ]
          }
          JSON
          jq . /tmp/payload.json

      - name: API /predict (SigV4 with --data-binary)
        run: |
          set -euo pipefail
          URL="${API_BASE%/}${API_PREDICT_PATH}"
          echo "POST $URL"
          # Toujours data-binary pour éviter les réécritures de shell
          code=$(curl -sS -m 35 -A "$UA" -H "Content-Type: application/json" \
                 --data-binary "@/tmp/payload.json" \
                 --aws-sigv4 "aws:amz:${AWS_REGION}:execute-api" \
                 -w "%{http_code}" -o /tmp/predict.json "$URL" || true)
          test "$code" = "200" || { echo "::error::HTTP $code on /predict"; cat /tmp/predict.json || true; exit 1; }
          cat /tmp/predict.json
          jq -e '.predictions|type=="array" and length>=1' /tmp/predict.json >/dev/null

      # ---------------- UI ----------------
      - name: UI index check (GET via CloudFront, browser UA, retry)
        run: |
          set -euo pipefail
          URL="${UI_BASE%/}/form_validated.html"
          echo "GET $URL"
          ok=""
          for i in $(seq 1 8); do
            code=$(curl -sS -m 25 -A "$UA" -H "Cache-Control: no-cache" \
                   -o /tmp/ui.html -w "%{http_code}" "$URL" || true)
            echo "Try $i: HTTP ${code:-N/A}"
            if [ "$code" = "200" ] || [ "$code" = "304" ]; then ok="yes"; break; fi
            sleep 5
          done
          test -n "$ok" || { echo "::error::UI not reachable (last code=$code)"; exit 1; }

      - name: UI config.json check
        run: |
          set -euo pipefail
          CFG="${UI_BASE%/}/config.json"
          echo "GET $CFG"
          curl -sS -m 25 -A "$UA" "$CFG" -o /tmp/config.json
          cat /tmp/config.json
          jq -e '.api_base and .index' /tmp/config.json >/dev/null

      - name: Summary
        run: |
          echo "✅ Smoke OK" >> $GITHUB_STEP_SUMMARY
          echo "- API: ${API_BASE}" >> $GITHUB_STEP_SUMMARY
          echo "- UI : ${UI_BASE}"  >> $GITHUB_STEP_SUMMARY

name: Smoke tests (UI + API, IAM + SigV4)

on:
  workflow_dispatch:
    inputs:
      api_id:
        description: "ID REST/API Gateway (ex: elh9s0fhdk)"
        required: false
      api_stage:
        description: "Stage de l'API (ex: dev)"
        default: "dev"
        required: false
      aws_region:
        description: "Région AWS (ex: eu-west-3)"
        default: "eu-west-3"
        required: false
      api_domain:
        description: "Domaine personnalisé (ex: api.mlopstheotiste.fr)"
        required: false
  push:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

concurrency:
  group: smoke-${{ github.ref_name }}
  cancel-in-progress: true

# Valeurs par défaut (peuvent être surchargées par workflow_dispatch inputs ou repo → Actions → Variables)
env:
  HEALTH_PATH: /health
  PREDICT_PATH: /predict
  TIMEOUT_S: 20
  # Fallbacks (utilisés si pas d'inputs):
  AWS_REGION: ${{ github.event_name == 'workflow_dispatch' && inputs.aws_region || vars.AWS_REGION || 'eu-west-3' }}
  API_ID:     ${{ github.event_name == 'workflow_dispatch' && inputs.api_id     || vars.API_ID     || '' }}
  API_STAGE:  ${{ github.event_name == 'workflow_dispatch' && inputs.api_stage  || vars.API_STAGE  || 'dev' }}
  API_DOMAIN: ${{ github.event_name == 'workflow_dispatch' && inputs.api_domain || vars.API_DOMAIN || '' }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Configure OIDC → creds temporaires exportés en variables d'env AWS_*
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve BASE_URL
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${API_DOMAIN}" ]; then
            BASE_URL="https://${API_DOMAIN}"
          else
            if [ -z "${API_ID}" ]; then
              echo "::error::API_ID manquant. Définir via dispatch input ou repo variable API_ID."; exit 1
            fi
            BASE_URL="https://${API_ID}.execute-api.${AWS_REGION}.amazonaws.com/${API_STAGE}"
          fi
          echo "BASE_URL=${BASE_URL}" | tee -a "$GITHUB_ENV"
          echo "Target: ${BASE_URL}"

      - name: "Sanity: caller + curl features"
        shell: bash
        run: |
          aws sts get-caller-identity
          curl -V | sed -n '1p;/Features/p'
          curl --help all | grep -iq aws-sigv4 || { echo '::error::curl sans --aws-sigv4'; exit 1; }
    
     
      - name: Install awscurl (SigV4)
        shell: bash
        run: |
          python3 -m pip install --user --upgrade awscurl
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build payload (30 floats)
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/payload.json <<'JSON'
          [17.99,10.38,122.8,1001.0,0.1184,0.2776,0.3001,0.1471,0.2419,0.07871,
           1.095,0.9053,8.589,153.4,0.006399,0.04904,0.05373,0.01587,0.03003,0.006193,
           25.38,17.33,184.6,2019.0,0.1622,0.6656,0.7119,0.2654,0.4601,0.1189]
          JSON
          jq . /tmp/payload.json >/dev/null
          test "$(jq 'length' /tmp/payload.json)" -eq 30

      - name: /health (public)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -i --connect-timeout 10 --max-time $TIMEOUT_S \
            "$BASE_URL${HEALTH_PATH}" | tee /tmp/health.txt
          grep -Eq '^HTTP/([0-9.]+) 200' /tmp/health.txt

      - name: /predict (SigV4 via awscurl)
        shell: bash
        run: |
          set -euo pipefail
          awscurl --service execute-api --region "$AWS_REGION" \
            -X POST -H 'Content-Type: application/json' \
            --data @/tmp/payload.json \
            "$BASE_URL${PREDICT_PATH}" | tee /tmp/predict_awscurl.json
          test -s /tmp/predict_awscurl.json

      - name: /predict (SigV4 via curl)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -i --connect-timeout 10 --max-time $TIMEOUT_S \
            --aws-sigv4 "aws:amz:${AWS_REGION}:execute-api" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/payload.json \
            "$BASE_URL${PREDICT_PATH}" | tee /tmp/predict_curl.txt
          grep -Eq '^HTTP/([0-9.]+) 200' /tmp/predict_curl.txt

      - name: Summarize
        if: always()
        shell: bash
        run: |
          echo '--- HEALTH ---'
          sed -n '1,8p' /tmp/health.txt || true
          echo '
--- PREDICT (awscurl) ---'
          head -c 400 /tmp/predict_awscurl.json || true
          echo '
--- PREDICT (curl) ---'
          sed -n '1,12p' /tmp/predict_curl.txt || true

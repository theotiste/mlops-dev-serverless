# .github/workflows/smoke.yml
name: Smoke tests (UI + API)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  workflow_run:
    workflows:
      - "UI → S3 + Invalidation CF"
    types: [completed]

concurrency:
  group: smoke-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  smoke:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      API_BASE:     ${{ vars.API_BASE     || secrets.API_BASE     }}
      UI_BASE:      ${{ vars.UI_BASE      || secrets.UI_BASE      }}
      AWS_REGION:   ${{ vars.AWS_REGION   || secrets.AWS_REGION   || 'eu-west-3' }}
      API_SMOKE_KEY: ${{ secrets.API_SMOKE_KEY || '' }}
      API_HEALTH_PATH:  /health
      API_PREDICT_PATH: /predict
      # UA “navigateur” pour éviter WAF/anti-bot
      UA_BROWSER: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
      # Fallback SigV4 pour /health si nécessaire
      HEALTH_SIGV4: ${{ vars.HEALTH_SIGV4 || 'false' }}

    steps:
      - name: Check required inputs
        run: |
          set -euo pipefail
          test -n "${API_BASE:-}"    || { echo "::error::Missing API_BASE"; exit 1; }
          test -n "${UI_BASE:-}"     || { echo "::error::Missing UI_BASE";  exit 1; }
          test -n "${AWS_REGION:-}"  || { echo "::error::Missing AWS_REGION"; exit 1; }
          test -n "${{ secrets.AWS_ROLE_ARN }}" || { echo "::error::Missing secret AWS_ROLE_ARN"; exit 1; }
          echo "API_BASE=${API_BASE}"
          echo "UI_BASE=${UI_BASE}"
          echo "AWS_REGION=${AWS_REGION}"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region:     ${{ env.AWS_REGION }}

        # Outils + lib SigV4 Python
      - name: Install tools (jq + Python deps)
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y jq python3-pip
          python3 -m pip install --upgrade pip
          python3 -m pip install requests requests-aws4auth boto3

      # ---------- API /health : anonyme via CloudFront, fallback SigV4 (optionnel) ----------
      - name: API /health (try anonymous then SigV4)
        run: |
          set -euo pipefail
          URL="${API_BASE%/}${API_HEALTH_PATH}"
          echo "GET $URL"
          code=$(curl -sS -m 20 -A "${UA_BROWSER}" -w "%{http_code}" -o /tmp/health.out "$URL" || true)
          echo "HTTP $code on /health"
          cat /tmp/health.out || true

          if [ "$code" = "200" ]; then
            echo "OK /health (anonymous)"
            exit 0
          fi

          if [ "${HEALTH_SIGV4}" = "true" ]; then
            echo "Anonymous failed ($code) → retry with SigV4"
            python3 - <<'PY'
import os,sys,requests,boto3
from requests_aws4auth import AWS4Auth

api_base=os.environ["API_BASE"].rstrip("/")
url=f"{api_base}{os.environ.get('API_HEALTH_PATH','/health')}"
region=os.environ["AWS_REGION"]
ua=os.environ.get("UA_BROWSER","gh-smoke")
api_key=os.environ.get("API_SMOKE_KEY","")

sess=boto3.Session()
creds=sess.get_credentials().get_frozen_credentials()
auth=AWS4Auth(creds.access_key,creds.secret_key,region,'execute-api',session_token=creds.token)

h={"User-Agent":ua}
if api_key: h["x-api-key"]=api_key

r=requests.get(url,auth=auth,headers=h,timeout=20)
print("----- response headers -----")
for k,v in r.headers.items(): print(f"{k}: {v}")
print("\n----- response body -----")
print(r.text)

if r.status_code!=200:
    print(f"HTTP {r.status_code} on /health",file=sys.stderr); sys.exit(1)
PY
          else
            echo "::error::HTTP $code on /health"; exit 1
          fi

      # ---------- payload de test ----------
      - name: Build smoke payload (30 floats)
        run: |
          cat > /tmp/payload.json <<'JSON'
          {
            "features": [
              14.5, 20.1, 95.5, 700.0, 0.10, 0.11, 0.08, 0.05, 0.18, 0.060,
              0.50, 1.10, 3.50, 40.0, 0.006, 0.020, 0.025, 0.010, 0.020, 0.003,
              16.5, 22.1, 110.0, 900.0, 0.13, 0.18, 0.20, 0.12, 0.28, 0.080
            ]
          }
          JSON
          jq . /tmp/payload.json

      # ---------- API /predict en SigV4 ----------
      - name: API /predict (SigV4)
        run: |
          python3 - <<'PY'
import os,sys,requests,json,boto3
from requests_aws4auth import AWS4Auth

api_base=os.environ["API_BASE"].rstrip("/")
url=f"{api_base}{os.environ.get('API_PREDICT_PATH','/predict')}"
region=os.environ["AWS_REGION"]
ua=os.environ.get("UA_BROWSER","gh-smoke")
api_key=os.environ.get("API_SMOKE_KEY","")

with open("/tmp/payload.json","r",encoding="utf-8") as f:
    payload=json.load(f)

sess=boto3.Session()
creds=sess.get_credentials().get_frozen_credentials()
auth=AWS4Auth(creds.access_key,creds.secret_key,region,'execute-api',session_token=creds.token)

h={"User-Agent":ua,"Content-Type":"application/json"}
if api_key: h["x-api-key"]=api_key

r=requests.post(url,json=payload,auth=auth,headers=h,timeout=30)

print("----- response headers -----")
for k,v in r.headers.items(): print(f"{k}: {v}")
print("\n----- response body -----")
print(r.text)

if r.status_code!=200:
    print(f"HTTP {r.status_code} on /predict",file=sys.stderr); sys.exit(1)

try:
    data=r.json()
except Exception:
    print("Predict response is not JSON",file=sys.stderr); sys.exit(1)

if ("predictions" not in data) or (not isinstance(data["predictions"],list)) or (len(data["predictions"])<1):
    print("Missing/invalid 'predictions'",file=sys.stderr); sys.exit(1)

probs=data.get("probabilities")
if probs is not None:
    try:
        vals=[]
        for row in probs:
            vals.extend(row if isinstance(row,list) else [row])
        if not all(0.0<=float(x)<=1.0 for x in vals): raise ValueError
    except Exception:
        print("Invalid 'probabilities' values (expected 0..1)",file=sys.stderr); sys.exit(1)

with open("/tmp/predict.json","w",encoding="utf-8") as f:
    json.dump(data,f,ensure_ascii=False,indent=2)
PY
          echo "---- predict.json ----"
          cat /tmp/predict.json

      # ---------- UI : page index ----------
      - name: UI index check (GET with retry)
        run: |
          set -euo pipefail
          URL="${UI_BASE%/}/form_validated.html"
          echo "GET ${URL}"
          ok=0
          for i in {1..8}; do
            code=$(curl -sS -m 20 -A "${UA_BROWSER}" -o /dev/null -w "%{http_code}" "$URL" || true)
            echo "Try $i: HTTP ${code}"
            if [ "$code" = "200" ] || [ "$code" = "304" ]; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = "1" || { echo "::error::UI not reachable via CloudFront (code=$code)"; exit 1; }

      # ---------- UI : config.json ----------
      - name: UI config.json check
        run: |
          set -euo pipefail
          CFG="${UI_BASE%/}/config.json"
          echo "GET ${CFG}"
          curl -sS -m 20 -A "${UA_BROWSER}" "$CFG" -o /tmp/config.json
          cat /tmp/config.json
          jq -e '.api_base and .index' /tmp/config.json >/dev/null

      # ---------- Summary ----------
      - name: Summary
        run: |
          echo "✅ Smoke tests passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- API base: ${API_BASE}" >> $GITHUB_STEP_SUMMARY
          echo "- UI  base: ${UI_BASE}"  >> $GITHUB_STEP_SUMMARY

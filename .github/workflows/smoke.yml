# .github/workflows/smoke.yml
name: Smoke tests (UI + API)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  workflow_run:
    workflows:
      - "UI → S3 + Invalidation CF"
    types: [completed]

concurrency:
  group: smoke-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  smoke:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      API_BASE:       ${{ vars.API_BASE       || secrets.API_BASE }}   # ex: https://.../dev
      UI_BASE:        ${{ vars.UI_BASE        || secrets.UI_BASE  }}    # ex: https://form.mlopstheotiste.fr
      AWS_REGION:     ${{ vars.AWS_REGION     || secrets.AWS_REGION || 'eu-west-3' }}
      API_SMOKE_KEY:  ${{ secrets.API_SMOKE_KEY || '' }}                # facultatif si API Key
      API_HEALTH_PATH:  /health
      API_PREDICT_PATH: /predict
      UA: "gh-smoke/${{ github.repository }}@${{ github.sha }}"

    steps:
      - name: Check required inputs
        run: |
          set -euo pipefail
          test -n "${API_BASE:-}" || { echo "::error::Missing API_BASE (vars or secrets)"; exit 1; }
          test -n "${UI_BASE:-}"  || { echo "::error::Missing UI_BASE  (vars or secrets)"; exit 1; }
          test -n "${AWS_REGION:-}" || { echo "::error::Missing AWS_REGION"; exit 1; }
          test -n "${{ secrets.AWS_ROLE_ARN }}" || { echo "::error::Missing secret AWS_ROLE_ARN"; exit 1; }
          echo "API_BASE=${API_BASE}"
          echo "UI_BASE=${UI_BASE}"
          echo "AWS_REGION=${AWS_REGION}"

      - name: Configure AWS credentials (OIDC / SigV4)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install tools (jq + Python deps)
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y jq python3-pip
          python3 -m pip install --upgrade pip
          python3 -m pip install requests requests-aws4auth boto3

      # ---------- API: /health (SigV4) ----------
      - name: API /health (try anonymous then SigV4)
        run: |
          set -euo pipefail
          PY="$(mktemp)"
          cat > "$PY" <<'PY'
          import os, sys, time
          import requests, boto3
          from requests_aws4auth import AWS4Auth

          base   = os.environ["API_BASE"].rstrip("/")
          path   = os.environ.get("API_HEALTH_PATH","/health")
          region = os.environ["AWS_REGION"]
          ua     = os.environ.get("UA","gh-smoke")
          api_key= os.environ.get("API_SMOKE_KEY","")
          url    = f"{base}{path}"

          def call(auth=None):
            h = {"User-Agent": ua}
            if api_key: h["x-api-key"] = api_key
            return requests.get(url, headers=h, auth=auth, timeout=20)

          # tentative anonyme si autorisé
          r = call()
          if r.status_code == 200:
            print(r.text); sys.exit(0)

          # sinon SigV4
          sess  = boto3.Session()
          creds = sess.get_credentials().get_frozen_credentials()
          auth  = AWS4Auth(creds.access_key, creds.secret_key, region, 'execute-api', session_token=creds.token)

          last = None
          for attempt in range(1, 5):
            try:
              last = call(auth=auth); print(last.text)
              if last.status_code < 500: break
            except Exception as e:
              print(f"[attempt {attempt}] {e}", file=sys.stderr)
            time.sleep(2*attempt)

          if not last or last.status_code != 200:
            print(f"HTTP {last.status_code if last else 'N/A'} on /health", file=sys.stderr)
            sys.exit(1)
          PY
          python3 "$PY"

      # ---------- API: /predict (SigV4) ----------
      - name: Build smoke payload (30 floats)
        run: |
          cat > /tmp/payload.json <<'JSON'
          {
            "features": [
              14.5, 20.1, 95.5, 700.0, 0.10, 0.11, 0.08, 0.05, 0.18, 0.060,
              0.50, 1.10, 3.50, 40.0, 0.006, 0.020, 0.025, 0.010, 0.020, 0.003,
              16.5, 22.1, 110.0, 900.0, 0.13, 0.18, 0.20, 0.12, 0.28, 0.080
            ]
          }
          JSON
          jq . /tmp/payload.json

      - name: API /predict (SigV4)
        run: |
          set -euo pipefail
          PY="$(mktemp)"
          cat > "$PY" <<'PY'
          import os, sys, time, json
          import requests, boto3
          from requests_aws4auth import AWS4Auth

          base   = os.environ["API_BASE"].rstrip("/")
          path   = os.environ.get("API_PREDICT_PATH","/predict")
          region = os.environ["AWS_REGION"]
          ua     = os.environ.get("UA","gh-smoke")
          api_key= os.environ.get("API_SMOKE_KEY","")
          url    = f"{base}{path}"

          with open("/tmp/payload.json","r",encoding="utf-8") as f:
            payload = json.load(f)

          sess  = boto3.Session()
          creds = sess.get_credentials().get_frozen_credentials()
          auth  = AWS4Auth(creds.access_key, creds.secret_key, region, 'execute-api', session_token=creds.token)

          headers = {"User-Agent": ua, "Content-Type":"application/json"}
          if api_key: headers["x-api-key"] = api_key

          last = None
          for attempt in range(1, 5):
            try:
              last = requests.post(url, json=payload, headers=headers, auth=auth, timeout=30)
              print(last.text)
              if last.status_code < 500: break
            except Exception as e:
              print(f"[attempt {attempt}] {e}", file=sys.stderr)
            time.sleep(2*attempt)

          if not last or last.status_code != 200:
            print(f"HTTP {last.status_code if last else 'N/A'} on /predict", file=sys.stderr); sys.exit(1)

          try:
            data = last.json()
          except Exception:
            print("Predict response is not JSON", file=sys.stderr); sys.exit(1)

          if ("predictions" not in data) or (not isinstance(data["predictions"], list)) or (len(data["predictions"]) < 1):
            print("Missing/invalid 'predictions'", file=sys.stderr); sys.exit(1)

          probs = data.get("probabilities")
          if probs is not None:
            flat = []
            for row in probs: flat += row if isinstance(row, list) else [row]
            if not all(0.0 <= float(x) <= 1.0 for x in flat):
              print("Invalid 'probabilities' values", file=sys.stderr); sys.exit(1)

          with open("/tmp/predict.json","w",encoding="utf-8") as f:
            json.dump(data,f,ensure_ascii=False,indent=2)
          PY
          python3 "$PY"
          echo "---- predict.json ----"
          cat /tmp/predict.json

      # ---------- UI: disponibilité ----------
      - name: UI index check (GET with retry)
        run: |
          set -euo pipefail
          HTML="${UI_BASE%/}/form_validated.html"
          echo "GET ${HTML}"
          # on suit les redirections (-L), on met un UA, on ne garde pas le corps (-o /dev/null)
          for i in {1..8}; do 
                 -H "Cache-Control: no-cache" \
                 -o /dev/null -w "%{http_code}" "$HTML" || true)
          if [ "$code" = "200" ] || [ "$code" = "304" ]; then
          echo "OK ${code}"
          exit 0
          fi
          echo "Try $i: HTTP ${code:-N/A}; sleep 5s…"
          sleep 5
          done
          echo "::error::UI not reachable: code=$code"
          exit 1
 
   
      - name: UI config.json check
        run: |
          set -euo pipefail
          CFG="${UI_BASE%/}/config.json"
          echo "GET ${CFG}"
          curl -sS -m 20 -A "${UA}" "$CFG" -o /tmp/config.json
          cat /tmp/config.json
          jq -e '.api_base and .index' /tmp/config.json >/dev/null

      - name: Summary
        run: |
          echo "✅ Smoke tests passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- API base: ${API_BASE}" >> $GITHUB_STEP_SUMMARY
          echo "- UI  base: ${UI_BASE}"  >> $GITHUB_STEP_SUMMARY

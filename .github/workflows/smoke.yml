# .github/workflows/smoke.yml
name: Smoke tests (UI + API)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  workflow_run:
    workflows:
      - "UI → S3 + Invalidation CF"     # <-- DOIT matcher exactement le name: du workflow UI
#      - "Deploy API (Serverless)"       # <-- ajoute-le si tu veux déclencher après le déploiement API
    branches: [ main ]                  # évite les runs hors main
    types: [ completed ]

concurrency:
  # Avec workflow_run, github.ref peut être vide → fallback sur head_branch, puis ref, puis run_id
  group: smoke-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  smoke:
    # On exécute si :
    #  - ce n'est PAS un workflow_run (push / dispatch) OU
    #  - c'est un workflow_run et la conclusion est 'success'
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      API_BASE: ${{ vars.API_BASE || secrets.API_BASE }}
      UI_BASE:  ${{ vars.UI_BASE  || secrets.UI_BASE  }}
      API_HEALTH_PATH: /health
      API_PREDICT_PATH: /predict

    steps:
      - name: Check inputs
        run: |
          set -euo pipefail
          test -n "${API_BASE:-}" || { echo "Missing API_BASE (Actions variables or secrets)"; exit 1; }
          test -n "${UI_BASE:-}"  || { echo "Missing UI_BASE  (Actions variables or secrets)"; exit 1; }
          echo "API_BASE=${API_BASE}"
          echo "UI_BASE=${UI_BASE}"

      - name: Install tools (jq)
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y jq

      # ---------- API: /health ----------
      - name: API health check
        run: |
          set -euo pipefail
          URL="${API_BASE%/}${API_HEALTH_PATH}"
          echo "GET ${URL}"

          UA="Mozilla/5.0 (compatible; GitHubActionsSmoke/1.0; +https://github.com/${GITHUB_REPOSITORY})"

          # pas de -f ; on garde le body même si 403, et on dump les headers
          code=$(curl -sS -m 20 \
                   -H "User-Agent: ${UA}" \
                   -D /tmp/health.hdr \
                   -o /tmp/health.json \
                   -w "%{http_code}" \
                   "$URL" \
                 || true)

          echo "HTTP $code"
          echo "----- response headers -----"
          sed -n '1,40p' /tmp/health.hdr || true
          echo "----- response body -----"
          cat /tmp/health.json || true

          test "$code" = "200" || { echo "HTTP $code on /health"; exit 1; }
          jq -e '.ok == true' /tmp/health.json >/dev/null || { echo "Health JSON invalid (missing ok:true)"; exit 1; }

      - name: API predict check
        run: |
          set -euo pipefail
          URL="${API_BASE%/}${API_PREDICT_PATH}"
          echo "POST ${URL}"

          UA="Mozilla/5.0 (compatible; GitHubActionsSmoke/1.0; +https://github.com/${GITHUB_REPOSITORY})"

          code=$(curl -sS -m 30 \
                   -H "Content-Type: application/json" \
                   -H "User-Agent: ${UA}" \
                   -D /tmp/predict.hdr \
                   -o /tmp/predict.json \
                   -w "%{http_code}" \
                   --data @/tmp/payload.json \
                   "$URL" \
                 || true)

          echo "HTTP $code"
          echo "----- response headers -----"
          sed -n '1,60p' /tmp/predict.hdr || true
          echo "----- response body -----"
          cat /tmp/predict.json || true

          test "$code" = "200" || { echo "HTTP $code on /predict"; exit 1; }
          jq -e '.predictions | type=="array" and (length>=1)' /tmp/predict.json >/dev/null
          jq -e '(.probabilities == null) or ((.probabilities|type=="array") and (.probabilities|length>=1) and (.probabilities[0]|length>=1))' /tmp/predict.json >/dev/null
          if jq -e '.probabilities != null' /tmp/predict.json >/dev/null; then
            jq -e '[.probabilities[][]] | all(. >= 0 and . <= 1)' /tmp/predict.json >/dev/null
          fi

    
      # ---------- UI: disponibilité ----------
      - name: UI index check (HTML page reachable)
        run: |
          set -euo pipefail
          HTML="${UI_BASE%/}/form_validated.html"
          echo "HEAD ${HTML}"
          for i in {1..5}; do
            code=$(curl -fsS -m 20 -o /null -w "%{http_code}" -I "$HTML" || true)
            if [ "$code" = "200" ]; then
              echo "OK 200"
              break
            fi
            echo "Try $i: got HTTP ${code:-N/A}; retry in 5s…"
            sleep 5
          done
          test "$code" = "200" || { echo "UI not reachable: code=$code"; exit 1; }

      - name: UI config.json check
        run: |
          set -euo pipefail
          CFG="${UI_BASE%/}/config.json"
          echo "GET ${CFG}"
          curl -fsS -m 20 "$CFG" -o /tmp/config.json
          cat /tmp/config.json
          jq -e '.api_base and .index' /tmp/config.json >/dev/null

      # ---------- Résumé job ----------
      - name: Summary
        run: |
          {
            echo "✅ Smoke tests passed"
            echo
            echo "- API: ${API_BASE}"
            echo "- UI : ${UI_BASE}"
          } >> "$GITHUB_STEP_SUMMARY"

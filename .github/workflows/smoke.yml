name: Smoke tests (UI + API)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-3' }}
      API_BASE:   ${{ vars.API_BASE   || secrets.API_BASE }}
      UI_BASE:    ${{ vars.UI_BASE    || secrets.UI_BASE }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      UA: Mozilla/5.0 GitHubActionsSmoke

    steps:
      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check inputs
        run: |
          set -euo pipefail
          : "${API_BASE:?Missing API_BASE}"
          : "${UI_BASE:?Missing UI_BASE}"

      - name: Install jq
        run: sudo apt-get update -y && sudo apt-get install -y jq

      - name: API /health (SigV4)
        run: |
          set -euo pipefail
          URL="${API_BASE%/}/health"
          code=$(curl -sS -m 20 -o /tmp/health.json -w '%{http_code}' \
            --aws-sigv4 "aws:amz:${AWS_REGION}:execute-api" "$URL")
          cat /tmp/health.json
          test "$code" = "200"

      - name: Build payload
        run: |
          cat > /tmp/payload.json <<'JSON'
          {"features":[14.5,20.1,95.5,700.0,0.10,0.11,0.08,0.05,0.18,0.060,0.50,1.10,3.50,40.0,0.006,0.020,0.025,0.010,0.020,0.003,16.5,22.1,110.0,900.0,0.13,0.18,0.20,0.12,0.28,0.080]}
          JSON
          jq . /tmp/payload.json

      - name: API /predict (SigV4)
        run: |
          set -euo pipefail
          URL="${API_BASE%/}/predict"
          code=$(curl -sS -m 25 -o /tmp/predict.json -w '%{http_code}' \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/payload.json \
            --aws-sigv4 "aws:amz:${AWS_REGION}:execute-api" "$URL")
          cat /tmp/predict.json
          test "$code" = "200"
          jq -e '.predictions and (.predictions|length>0)' /tmp/predict.json >/dev/null

      - name: UI index
        run: |
          set -euo pipefail
          URL="${UI_BASE%/}/form_validated.html"
          code=$(curl -sS -m 20 -A "${UA}" -o /dev/null -w '%{http_code}' "$URL" || true)
          test "$code" = "200"

      - name: UI config.json
        run: |
          set -euo pipefail
          CFG="${UI_BASE%/}/config.json"
          curl -sS -m 20 -A "${UA}" "$CFG" | tee /tmp/cfg.json >/dev/null
          jq -e '.api_base and .index' /tmp/cfg.json >/dev/null

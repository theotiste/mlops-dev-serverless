# .github/workflows/smoke.yml
name: Smoke tests (UI + API)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  workflow_run:
    workflows:
      # - "Deploy API (Serverless)"         # adaptez si vous le reliez au déploiement API
      - "UI → S3 + Invalidation CF"        # nom exact du workflow UI
    types: [completed]

concurrency:
  group: smoke-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write         # OIDC -> STS:AssumeRole (nécessaire si SigV4)
  contents: read

jobs:
  smoke:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      API_BASE:        ${{ vars.API_BASE        || secrets.API_BASE        }}
      UI_BASE:         ${{ vars.UI_BASE         || secrets.UI_BASE         }}
      AWS_REGION:      ${{ vars.AWS_REGION      || secrets.AWS_REGION      || 'eu-west-3' }}
      AWS_ROLE_ARN:    ${{ vars.AWS_ROLE_ARN    || secrets.AWS_ROLE_ARN    || '' }}
      API_SMOKE_KEY:   ${{ secrets.API_SMOKE_KEY || '' }}

      API_HEALTH_PATH:  /health
      API_PREDICT_PATH: /predict
      UA:              "gh-smoke/${{ github.repository }}@${{ github.sha }}"
      USE_SIGV4:       ${{ vars.USE_SIGV4 || 'false' }}

    steps:
      - name: Decide mode
        run: |
          set -euo pipefail
          MODE=$([[ "${USE_SIGV4}" == "true" ]] && echo sigv4 || echo anonymous)
          echo "MODE=${MODE}" | tee -a $GITHUB_ENV

      - name: Check inputs
        run: |
          set -euo pipefail
          test -n "${API_BASE:-}" || { echo "::error::Missing API_BASE"; exit 1; }
          test -n "${UI_BASE:-}"  || { echo "::error::Missing UI_BASE"; exit 1; }
          echo "API_BASE=${API_BASE}"
          echo "UI_BASE=${UI_BASE}"
          echo "AWS_REGION=${AWS_REGION}"
          echo "MODE=${MODE}"
          if [ "${MODE}" = "sigv4" ]; then
            test -n "${AWS_ROLE_ARN:-}" || { echo "::error::Missing AWS_ROLE_ARN (required when USE_SIGV4=true)"; exit 1; }
          fi

      - name: Configure AWS credentials (OIDC / SigV4 only)
        if: env.MODE == 'sigv4'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region:     ${{ env.AWS_REGION }}

      - name: Who am I? (debug)
        if: env.MODE == 'sigv4'
        run: aws sts get-caller-identity

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y jq python3-pip
          python3 -m pip install --upgrade pip
          python3 -m pip install requests requests-aws4auth boto3

      # ----------- API /health -----------
      - name: API health check
        run: |
          set -euo pipefail
          PY=$(mktemp)
          cat > "$PY" <<'PY'
          import os, sys, time, json
          import requests
          from requests_aws4auth import AWS4Auth
          import boto3

          api_base   = os.environ["API_BASE"].rstrip("/")
          path       = os.environ.get("API_HEALTH_PATH","/health")
          region     = os.environ["AWS_REGION"]
          use_sigv4  = os.environ.get("USE_SIGV4","false").lower() == "true"
          api_key    = os.environ.get("API_SMOKE_KEY","")
          ua         = os.environ.get("UA","gh-smoke")

          url  = f"{api_base}{path}"
          auth = None
          if use_sigv4:
            sess = boto3.Session()
            creds = sess.get_credentials().get_frozen_credentials()
            auth  = AWS4Auth(creds.access_key, creds.secret_key, region, 'execute-api', session_token=creds.token)

          headers = {"User-Agent": ua}
          if api_key:
            headers["x-api-key"] = api_key

          last = None
          for attempt in range(1,6):
            try:
              r = requests.get(url, headers=headers, auth=auth, timeout=20)
              last = r
              print("----- response headers -----")
              for k,v in r.headers.items(): print(f"{k}: {v}")
              print("\n----- response body -----")
              print(r.text)
              if r.status_code < 500:
                break
            except Exception as e:
              print(f"[attempt {attempt}] {e}", file=sys.stderr)
            time.sleep(2*attempt)

          if last is None:
            print("No response", file=sys.stderr); sys.exit(1)
          if last.status_code != 200:
            print(f"HTTP {last.status_code} on /health", file=sys.stderr); sys.exit(1)

          try:
            data = last.json()
            if "ok" in data and data["ok"] is not True:
              print("Health JSON invalid (ok!=true)", file=sys.stderr); sys.exit(1)
            with open("/tmp/health.json","w",encoding="utf-8") as f:
              json.dump(data,f,ensure_ascii=False,indent=2)
          except Exception:
            pass
          PY
          python3 "$PY"

      # ----------- API /predict -----------
      - name: Build smoke payload (30 floats)
        run: |
          cat > /tmp/payload.json <<'JSON'
          {
            "features": [
              14.5, 20.1, 95.5, 700.0, 0.10, 0.11, 0.08, 0.05, 0.18, 0.060,
              0.50, 1.10, 3.50, 40.0, 0.006, 0.020, 0.025, 0.010, 0.020, 0.003,
              16.5, 22.1, 110.0, 900.0, 0.13, 0.18, 0.20, 0.12, 0.28, 0.080
            ]
          }
          JSON
          jq . /tmp/payload.json

      - name: API predict check
        run: |
          set -euo pipefail
          PY=$(mktemp)
          cat > "$PY" <<'PY'
          import os, sys, time, json
          import requests
          from requests_aws4auth import AWS4Auth
          import boto3

          api_base   = os.environ["API_BASE"].rstrip("/")
          path       = os.environ.get("API_PREDICT_PATH","/predict")
          region     = os.environ["AWS_REGION"]
          use_sigv4  = os.environ.get("USE_SIGV4","false").lower() == "true"
          api_key    = os.environ.get("API_SMOKE_KEY","")
          ua         = os.environ.get("UA","gh-smoke")

          url  = f"{api_base}{path}"
          with open("/tmp/payload.json","r",encoding="utf-8") as f:
            payload = json.load(f)

          auth = None
          if use_sigv4:
            sess = boto3.Session()
            creds = sess.get_credentials().get_frozen_credentials()
            auth  = AWS4Auth(creds.access_key, creds.secret_key, region, 'execute-api', session_token=creds.token)

          headers = {"User-Agent": ua, "Content-Type":"application/json"}
          if api_key:
            headers["x-api-key"] = api_key

          last = None
          for attempt in range(1,6):
            try:
              r = requests.post(url, json=payload, headers=headers, auth=auth, timeout=30)
              last = r
              print("----- response headers -----")
              for k,v in r.headers.items(): print(f"{k}: {v}")
              print("\n----- response body -----")
              print(r.text)
              if r.status_code < 500:
                break
            except Exception as e:
              print(f"[attempt {attempt}] {e}", file=sys.stderr)
            time.sleep(2*attempt)

          if last is None:
            print("No response", file=sys.stderr); sys.exit(1)
          if last.status_code != 200:
            print(f"HTTP {last.status_code} on /predict", file=sys.stderr); sys.exit(1)

          try:
            data = last.json()
          except Exception:
            print("Predict response is not JSON", file=sys.stderr); sys.exit(1)

          if ("predictions" not in data) or (not isinstance(data["predictions"], list)) or (len(data["predictions"]) < 1):
            print("Missing/invalid 'predictions'", file=sys.stderr); sys.exit(1)

          probs = data.get("probabilities")
          if probs is not None:
            flat=[]
            try:
              for row in probs:
                if isinstance(row, list): flat+=row
                else: flat.append(row)
              ok = all(0.0 <= float(x) <= 1.0 for x in flat)
            except Exception:
              ok = False
            if not ok:
              print("Invalid 'probabilities' values (expected 0..1)", file=sys.stderr); sys.exit(1)

          with open("/tmp/predict.json","w",encoding="utf-8") as f:
            json.dump(data,f,ensure_ascii=False,indent=2)
          PY
          python3 "$PY"
          echo "---- predict.json ----"
          cat /tmp/predict.json

      # ----------- UI -----------
      - name: UI index check (HEAD with retry)
        run: |
          set -euo pipefail
          HTML="${UI_BASE%/}/form_validated.html"
          echo "HEAD ${HTML}"
          for i in {1..6}; do
            code=$(curl -sS -m 20 -A "${UA}" -I -o /dev/null -w "%{http_code}" "$HTML" || true)
            if [ "$code" = "200" ]; then echo "OK 200"; break; fi
            echo "Try $i: got HTTP ${code:-N/A}; sleep 5s…"; sleep 5
          done
          test "$code" = "200" || { echo "::error::UI not reachable: code=$code"; exit 1; }

      - name: UI config.json check
        run: |
          set -euo pipefail
          CFG="${UI_BASE%/}/config.json"
          echo "GET ${CFG}"
          curl -sS -m 20 -A "${UA}" "$CFG" -o /tmp/config.json
          cat /tmp/config.json
          jq -e '.api_base and .index' /tmp/config.json >/dev/null

      - name: Summary
        run: |
          {
            echo "✅ Smoke tests passed"
            echo
            echo "- Mode     : ${MODE}"
            echo "- API base : ${API_BASE}"
            echo "- UI  base : ${UI_BASE}"
          } >> $GITHUB_STEP_SUMMARY

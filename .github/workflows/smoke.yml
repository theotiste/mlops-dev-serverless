name: Smoke tests (UI + API)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  workflow_run:
    workflows:
      - "UI → S3 + Invalidation CF"
    types: [completed]

concurrency:
  group: smoke-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      API_BASE:      ${{ vars.API_BASE      || secrets.API_BASE      }}
      API_STAGE:     ${{ vars.API_STAGE     || secrets.API_STAGE     || 'dev' }}
      UI_BASE:       ${{ vars.UI_BASE       || secrets.UI_BASE       }}
      AWS_REGION:    ${{ vars.AWS_REGION    || secrets.AWS_REGION    || 'eu-west-3' }}
      API_SMOKE_KEY: ${{ secrets.API_SMOKE_KEY || '' }}

      API_HEALTH_PATH:  /health
      API_PREDICT_PATH: /predict

      # --- contrôle précis de l’auth ---
      HEALTH_AUTH:   ${{ vars.HEALTH_AUTH || 'anonymous' }}   # anonymous | sigv4
      PREDICT_AUTH:  ${{ vars.PREDICT_AUTH || 'sigv4' }}      # sigv4 | anonymous
      ALLOW_ANON_FALLBACK: ${{ vars.ALLOW_ANON_FALLBACK || 'true' }}

      UA: "gh-smoke/${{ github.repository }}@${{ github.sha }}"

    steps:
      - name: Normalize API_BASE (append stage if missing)
        run: |
          set -euo pipefail
          base="${API_BASE%/}"
          if [[ "$base" != */${API_STAGE} && "$base" != */${API_STAGE}/ ]]; then
            base="$base/${API_STAGE}"
          fi
          echo "API_BASE=$base" | tee -a $GITHUB_ENV
          echo "→ API URL used: ${base}"
          echo "→ HEALTH_AUTH=${HEALTH_AUTH}, PREDICT_AUTH=${PREDICT_AUTH}"

      - name: Check inputs
        run: |
          set -euo pipefail
          test -n "${API_BASE:-}" || { echo "::error::Missing API_BASE"; exit 1; }
          test -n "${UI_BASE:-}"  || { echo "::error::Missing UI_BASE"; exit 1; }
          echo "UI_BASE=${UI_BASE}"

      # --- OIDC seulement si on a besoin de SigV4 ---
      - name: Configure AWS credentials (OIDC)
        if: env.HEALTH_AUTH == 'sigv4' || env.PREDICT_AUTH == 'sigv4'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install deps (jq + python SigV4)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq python3-pip
          python3 -m pip install --upgrade pip
          python3 -m pip install requests boto3 requests-aws4auth

      # ---------- /health ----------
      - name: API health check (anonymous)
        if: env.HEALTH_AUTH == 'anonymous'
        run: |
          set -euo pipefail
          URL="${API_BASE%/}${API_HEALTH_PATH}"
          echo "GET $URL (anonymous)"
          http=$(curl -sS -i -m 20 -A "${UA}" -o /tmp/hdr -w "%{http_code}" "$URL")
          cat /tmp/hdr
          test "$http" = "200" || { echo "::error::HTTP $http on /health"; exit 1; }

      - name: API health check (SigV4)
        if: env.HEALTH_AUTH == 'sigv4'
        run: |
          set -euo pipefail
          URL="${API_BASE%/}${API_HEALTH_PATH}"
          echo "GET $URL (SigV4)"
          python3 - <<'PY'
          import os, sys, json, boto3, requests
          from requests_aws4auth import AWS4Auth
          url=os.environ["API_BASE"].rstrip("/")+os.environ.get("API_HEALTH_PATH","/health")
          region=os.environ["AWS_REGION"]
          ua=os.environ.get("UA","gh-smoke")
          s=boto3.Session(); c=s.get_credentials().get_frozen_credentials()
          auth=AWS4Auth(c.access_key,c.secret_key,region,'execute-api',session_token=c.token)
          r=requests.get(url,headers={"User-Agent":ua},auth=auth,timeout=20)
          print("status:",r.status_code); print(r.headers); print(r.text)
          sys.exit(0 if r.status_code==200 else 1)
          PY

      # Fallback si on avait choisi SigV4 mais que ça 403
      - name: API health retry anonymous (fallback)
        if: env.HEALTH_AUTH == 'sigv4' && env.ALLOW_ANON_FALLBACK == 'true' && failure()
        run: |
          set -euo pipefail
          URL="${API_BASE%/}${API_HEALTH_PATH}"
          echo "Retry GET $URL (fallback anonymous)"
          http=$(curl -sS -i -m 20 -A "${UA}" -o /tmp/hdr -w "%{http_code}" "$URL")
          cat /tmp/hdr
          test "$http" = "200" || { echo "::error::HTTP $http on /health (fallback)"; exit 1; }

      # ---------- /predict ----------
      - name: Build payload
        run: |
          cat > /tmp/payload.json <<'JSON'
          { "features": [14.5,20.1,95.5,700.0,0.10,0.11,0.08,0.05,0.18,0.060,0.50,1.10,3.50,40.0,0.006,0.020,0.025,0.010,0.020,0.003,16.5,22.1,110.0,900.0,0.13,0.18,0.20,0.12,0.28,0.080] }
          JSON
          jq . /tmp/payload.json

      - name: API predict (SigV4)
        if: env.PREDICT_AUTH == 'sigv4'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, sys, json, boto3, requests
          from requests_aws4auth import AWS4Auth
          base=os.environ["API_BASE"].rstrip("/")
          url=base+os.environ.get("API_PREDICT_PATH","/predict")
          region=os.environ["AWS_REGION"]
          ua=os.environ.get("UA","gh-smoke")
          s=boto3.Session(); c=s.get_credentials().get_frozen_credentials()
          auth=AWS4Auth(c.access_key,c.secret_key,region,'execute-api',session_token=c.token)
          with open("/tmp/payload.json") as f: p=json.load(f)
          r=requests.post(url,json=p,auth=auth,headers={"User-Agent":ua,"Content-Type":"application/json"},timeout=30)
          print("status:",r.status_code); print(r.headers); print(r.text)
          sys.exit(0 if r.status_code==200 else 1)
          PY

      - name: API predict (anonymous or fallback)
        if: env.PREDICT_AUTH == 'anonymous' || (env.PREDICT_AUTH == 'sigv4' && failure() && env.ALLOW_ANON_FALLBACK == 'true')
        run: |
          set -euo pipefail
          URL="${API_BASE%/}${API_PREDICT_PATH}"
          echo "POST $URL (anonymous)"
          http=$(curl -sS -i -m 30 -A "${UA}" -H "Content-Type: application/json" -d @/tmp/payload.json -o /tmp/pred -w "%{http_code}" "$URL")
          cat /tmp/pred
          test "$http" = "200" || { echo "::error::HTTP $http on /predict"; exit 1; }

      # ---------- UI ----------
      - name: UI index check
        run: |
          set -euo pipefail
          HTML="${UI_BASE%/}/form_validated.html"
          for i in {1..6}; do
            code=$(curl -sS -I -m 20 -A "${UA}" -o /dev/null -w "%{http_code}" "$HTML" || true)
            if [ "$code" = "200" ]; then echo "UI OK"; break; fi
            echo "try $i: $code"; sleep 5
          done
          test "$code" = "200" || { echo "::error::UI not reachable"; exit 1; }

      - name: UI config.json
        run: |
          set -euo pipefail
          CFG="${UI_BASE%/}/config.json"
          curl -sS -m 20 -A "${UA}" "$CFG" -o /tmp/cfg.json
          cat /tmp/cfg.json
          jq -e '.api_base and .index' /tmp/cfg.json >/dev/null

      - name: Summary
        run: |
          echo "✅ Smoke OK" >> $GITHUB_STEP_SUMMARY
          echo "- API: ${API_BASE}" >> $GITHUB_STEP_SUMMARY
          echo "- UI : ${UI_BASE}"  >> $GITHUB_STEP_SUMMARY

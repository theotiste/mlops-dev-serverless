# .github/workflows/deploy.yaml
name: Deploy API (Serverless)

on:
  push:
    branches: [ main ]
    paths:
      - "serverless.yml"
      - "serverless.yaml"
      - "handler.py"
      - "requirements.txt"
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - ".github/workflows/deploy.yaml"
  workflow_dispatch:

permissions:
  id-token: write      # OIDC vers AWS
  contents: read

env:
  STAGE: dev
  AWS_REGION: eu-west-3
  # Evite la télémétrie et les prompts en CI
  SLS_TELEMETRY_DISABLED: "1"
  SLS_NOTIFICATION_MODE: error
  # Access key Serverless v4 (Dashboard)
  SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}

jobs:
  deploy:
    name: Deploy with Serverless
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --- Auth AWS via OIDC (recommandé) ---
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          output-credentials: true

      # --- Dépendances ---
      - name: Install Node deps (for Serverless + plugins)
        run: npm ci

      # Si ton plugin serverless-python-requirements construit en local,
      # Python/pip doivent être présents (déjà via setup-python).
      # Tu n'as rien à installer ici pour le plugin : il vient de npm.

      - name: Print versions
        run: |
          node -v
          python --version
          npx serverless@4 --version

      # --- Déploiement ---
      - name: Serverless deploy
        run: |
          npx serverless@4 deploy \
            --stage "${STAGE}" \
            --region "${AWS_REGION}" \
            --conceal
        env:
          # Pour être explicite si tu veux overrider la région depuis les secrets
          AWS_REGION: ${{ secrets.AWS_REGION || env.AWS_REGION }}
          # (déjà injectée au niveau env global)
          SERVERLESS_ACCESS_KEY: ${{ env.SERVERLESS_ACCESS_KEY }}

      # --- Infos post-déploiement (endpoints, layers, etc.) ---
      - name: Serverless info
        if: always()
        run: |
          npx serverless@4 info \
            --stage "${STAGE}" \
            --region "${AWS_REGION}" || true

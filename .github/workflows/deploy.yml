name: Deploy backend + trigger Amplify

on:
  push:
    branches: [main]
    # redeploy when backend or UI changes
    paths:
      - 'serverless.yaml'
      - 'handler.*'
      - 'requirements.txt'
      - 'ui/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  STAGE: dev
  AWS_REGION: eu-west-3

jobs:
  backend:
    name: Serverless deploy
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Node deps (if present)
        run: |
          if [ -f package-lock.json ] || [ -f package.json ]; then
            npm ci || npm i
          fi

      - name: Docker warm-up (for serverless-python-requirements)
        run: |
          docker --version
          sudo systemctl start docker || true
          # Pulling a common SAM image avoids cold pulls during deploy
          docker pull public.ecr.aws/sam/build-python3.12:latest-arm64 || true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          # or, if you don't use OIDC/role:
          # aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          # aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Deploy with Serverless
        run: |
          npx -y serverless@4 deploy \
            --stage "$STAGE" \
            --region "$AWS_REGION" \
            --verbose

      - name: Show stack info
        run: |
          npx -y serverless@4 info \
            --stage "$STAGE" \
            --region "$AWS_REGION" || true
            
frontend:
  name: Trigger Amplify build
    needs: backend
    runs-on: ubuntu-latest

  permissions:
    id-token: write
    contents: read

  # <<< on expose les secrets dans env >>>
  env:
    AMPLIFY_WEBHOOK_URL: ${{ secrets.AMPLIFY_WEBHOOK_URL }}
    AMPLIFY_APP_ID:      ${{ secrets.AMPLIFY_APP_ID }}
    AMPLIFY_BRANCH:      ${{ secrets.AMPLIFY_BRANCH }}
    AWS_REGION:          ${{ secrets.AWS_REGION }}
    AWS_ROLE_ARN:        ${{ secrets.AWS_ROLE_TO_ASSUME }}

  steps:
  # ---- Méthode A : Webhook (simple) ----
    - name: Trigger Amplify via Webhook
        if: env.AMPLIFY_WEBHOOK_URL != ''
        run: |
          curl -s -X POST \
            -H "Content-Type: application/json" \
            -d '{"trigger":"github-actions"}' \
            "$AMPLIFY_WEBHOOK_URL"

  # ---- Méthode B : CLI/SDK (si pas de webhook) ----
    - name: Configure AWS credentials for CLI
        if: env.AMPLIFY_WEBHOOK_URL == '' && env.AMPLIFY_APP_ID != '' && env.AMPLIFY_BRANCH != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region:       ${{ env.AWS_REGION }}
          role-to-assume:   ${{ env.AWS_ROLE_ARN }}

    - name: Start Amplify job (RELEASE)
        if: env.AMPLIFY_WEBHOOK_URL == '' && env.AMPLIFY_APP_ID != '' && env.AMPLIFY_BRANCH != ''
        run: |
          aws amplify start-job \
            --app-id "$AMPLIFY_APP_ID" \
            --branch-name "$AMPLIFY_BRANCH" \
            --job-type RELEASE
           

 

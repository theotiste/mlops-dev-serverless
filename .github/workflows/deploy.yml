name: Deploy backend + trigger Amplify

on:
  push:
    branches: [main]
    # redeploy when backend or UI changes
    paths:
      - 'serverless.yaml'
      - 'handler.*'
      - 'requirements.txt'
      - 'ui/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  STAGE: dev
  AWS_REGION: eu-west-3

jobs:
  backend:
    name: Serverless deploy
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Node deps (if present)
        run: |
          if [ -f package-lock.json ] || [ -f package.json ]; then
            npm ci || npm i
          fi

      - name: Docker warm-up (for serverless-python-requirements)
        run: |
          docker --version
          sudo systemctl start docker || true
          # Pulling a common SAM image avoids cold pulls during deploy
          docker pull public.ecr.aws/sam/build-python3.12:latest-arm64 || true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          # or, if you don't use OIDC/role:
          # aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          # aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Deploy with Serverless
        run: |
          npx -y serverless@4 deploy \
            --stage "$STAGE" \
            --region "$AWS_REGION" \
            --verbose

      - name: Show stack info
        run: |
          npx -y serverless@4 info \
            --stage "$STAGE" \
            --region "$AWS_REGION" || true

  frontend:
    name: Trigger Amplify build
    needs: backend
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials (only for CLI method)
        if: secrets.AMPLIFY_APP_ID != '' && secrets.AMPLIFY_BRANCH != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          # or AK/SK if you prefer

      # ---- Method A: Webhook (simplest) ----
      - name: Trigger Amplify via Webhook
        if: secrets.AMPLIFY_WEBHOOK_URL != ''
        run: |
          curl -s -X POST \
            -H "Content-Type: application/json" \
            -d '{"trigger":"github-actions"}' \
            "${{ secrets.AMPLIFY_WEBHOOK_URL }}"

      # ---- Method B: AWS CLI (triggers & waits) ----
      - name: Trigger Amplify via CLI
        if: secrets.AMPLIFY_APP_ID != '' && secrets.AMPLIFY_BRANCH != ''
        id: start
        run: |
          JOB_JSON=$(aws amplify start-job \
            --app-id "${{ secrets.AMPLIFY_APP_ID }}" \
            --branch-name "${{ secrets.AMPLIFY_BRANCH }}" \
            --job-type RELEASE)
          echo "$JOB_JSON"
          JOB_ID=$(echo "$JOB_JSON" | jq -r '.jobSummary.jobId')
          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for Amplify job to finish
        if: steps.start.outputs.job_id != ''
        run: |
          APP_ID="${{ secrets.AMPLIFY_APP_ID }}"
          BRANCH="${{ secrets.AMPLIFY_BRANCH }}"
          JOB_ID="${{ steps.start.outputs.job_id }}"
          echo "Waiting for Amplify job $JOB_ID on $BRANCH"
          for i in {1..60}; do
            STATUS=$(aws amplify get-job \
              --app-id "$APP_ID" \
              --branch-name "$BRANCH" \
              --job-id "$JOB_ID" \
              | jq -r '.job.summary.status')
            echo "Status: $STATUS"
            if [ "$STATUS" = "SUCCEED" ]; then exit 0; fi
            if [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "CANCELLED" ]; then exit 1; fi
            sleep 10
          done
          echo "Timeout waiting Amplify job"; exit 1

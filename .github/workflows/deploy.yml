name: Deploy (Serverless v4 + static keys)

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Serverless stage (dev|prod)"
        default: "dev"
        required: true
      region:
        description: "AWS region"
        default: "eu-west-3"
        required: true
      api_base_url:
        description: "Optional base URL for smoke check (e.g. https://api.mlopstheotiste.fr)"
        required: false
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ inputs.region || 'eu-west-3' }}
  STAGE: ${{ inputs.stage || 'dev' }}
  API_BASE_URL: ${{ inputs.api_base_url || vars.API_BASE_URL || '' }}
  TIMEOUT_S: 20

defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'


      - name: Install Serverless (v4)
        run: |
          npm i -g serverless@4
          serverless --version


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Serverless plugins (local devDeps)
        run: |
          set -euo pipefail
          test -f package.json || npm init -y
          npm i -D serverless-python-requirements@6    

      - name: Configure AWS credentials (static keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy (Serverless v4)
        env:
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}  # ← tu l’as déjà
          SLS_ORG:  ${{ vars.SLS_ORG }}   # à définir dans Actions → Variables (ou remplace en dur)
          SLS_APP:  ${{ vars.SLS_APP }}   # idem
        run: |
          set -euo pipefail
          serverless deploy --stage "$STAGE" --region "$AWS_REGION" \
          --org "$SLS_ORG" --app "$SLS_APP"
          serverless info   --stage "$STAGE" --region "$AWS_REGION"
    

      - name: "/health check (optional)"
        if: ${{ env.API_BASE_URL != '' }}
        run: |
          set -euo pipefail
          curl -fsS -i --connect-timeout 10 --max-time $TIMEOUT_S "$API_BASE_URL/health" | tee /tmp/health.txt
          grep -Eq '^HTTP/([

name: Deploy (Serverless v4 + static keys)

on:
  workflow_dispatch:
    inputs:
      stage:  { description: "dev|prod", default: "dev", required: true }
      region: { description: "AWS region", default: "eu-west-3", required: true }
      api_base_url:
        description: "Optional base URL for smoke check (ex: https://api.mlopstheotiste.fr)"
        required: false
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Serverless (v4)
        run: |
          npm i -g serverless@4
          serverless --version

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip tools
        run: python -m pip install --upgrade pip setuptools wheel virtualenv

      - name: Install project dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm i; fi
          npx serverless plugin list || true

      - name: Configure AWS credentials (static keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ inputs.region || 'eu-west-3' }}

      - name: Deploy (Serverless v4)
        env:
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
          STAGE:      ${{ inputs.stage  || 'dev' }}
          AWS_REGION: ${{ inputs.region || 'eu-west-3' }}
          SLS_ORG:    ${{ vars.SLS_ORG }}   # facultatif si déjà dans serverless.yml
          SLS_APP:    ${{ vars.SLS_APP }}   # idem
        run: |
          set -euo pipefail
          EXTRA=""
          [ -n "${SLS_ORG:-}" ] && EXTRA="$EXTRA --org ${SLS_ORG}"
          [ -n "${SLS_APP:-}" ] && EXTRA="$EXTRA --app ${SLS_APP}"
          serverless deploy --stage "$STAGE" --region "$AWS_REGION" $EXTRA
          serverless info   --stage "$STAGE" --region "$AWS_REGION" $EXTRA

      - name: /health check (optional)
        if: ${{ inputs.api_base_url != '' }}
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
        run: |
          curl -fsS -i --connect-timeout 10 --max-time 20 "$API_BASE_URL/health" | tee /tmp/health.txt
          grep -Eq '^HTTP/([0-9.]+) 200' /tmp/health.txt

      - name: /predict (optional, SigV4)
        if: ${{ inputs.api_base_url != '' }}
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
          AWS_REGION:   ${{ inputs.region || 'eu-west-3' }}
        run: |
          echo '[17.99,10.38,122.8,1001.0,0.1184,0.2776,0.3001,0.1471,0.2419,0.07871,1.095,0.9053,8.589,153.4,0.006399,0.04904,0.05373,0.01587,0.03003,0.006193,25.38,17.33,184.6,2019.0,0.1622,0.6656,0.7119,0.2654,0.4601,0.1189]' > payload.json
          curl -fsS -i --aws-sigv4 "aws:amz:${AWS_REGION}:execute-api" \
               -H "Content-Type: application/json" \
               --data-binary @payload.json "$API_BASE_URL/predict" | tee /tmp/predict.txt
          grep -Eq '^HTTP/([0-9.]+) 200' /tmp/predict.txt

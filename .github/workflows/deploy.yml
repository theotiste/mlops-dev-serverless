name: Deploy (Serverless + static AWS keys)

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Serverless stage (dev|prod)"
        default: "dev"
        required: true
      region:
        description: "AWS region"
        default: "eu-west-3"
        required: true
      api_base_url:
        description: "Optional base URL for smoke check (e.g. https://api.mlopstheotiste.fr)"
        required: false
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ inputs.region || 'eu-west-3' }}
  STAGE: ${{ inputs.stage || 'dev' }}
  API_BASE_URL: ${{ inputs.api_base_url || vars.API_BASE_URL || '' }}
  TIMEOUT_S: 20

defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: - name: Install Serverless Framework (pin v3)
        run: |
          npm i -g serverless@3
          serverless --version

      - name: Configure AWS credentials (static keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: serverless deploy --stage "$STAGE" --region "$AWS_REGION"
          serverless info --stage "$STAGE" --region "$AWS_REGION"

      - name: Optional /health check (public)
        if: ${{ env.API_BASE_URL != '' }}
        run: |
          set -euo pipefail
          curl -fsS -i --connect-timeout 10 --max-time $TIMEOUT_S \
            "$API_BASE_URL/health" | tee /tmp/health.txt
          grep -Eq '^HTTP/([0-9.]+) 200' /tmp/health.txt

      - name: Optional /predict (SigV4) using static keys
        if: ${{ env.API_BASE_URL != '' }}
        run: |
          set -euo pipefail
          echo '[17.99,10.38,122.8,1001.0,0.1184,0.2776,0.3001,0.1471,0.2419,0.07871,1.095,0.9053,8.589,153.4,0.006399,0.04904,0.05373,0.01587,0.03003,0.006193,25.38,17.33,184.6,2019.0,0.1622,0.6656,0.7119,0.2654,0.4601,0.1189]' > payload.json
          curl -fsS -i \
            --aws-sigv4 "aws:amz:${AWS_REGION}:execute-api" \
            -H "Content-Type: application/json" \
            --data-binary @payload.json \
            "$API_BASE_URL/predict" | tee /tmp/predict.txt
          grep -Eq '^HTTP/([0-9.]+) 200' /tmp/predict.txt

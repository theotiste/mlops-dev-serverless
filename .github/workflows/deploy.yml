name: Deploy (Serverless + Amplify)

on:
  push:
    branches: [ main ]
    paths:
      - "serverless.yaml"
      - "handler.py"
      - "requirements.txt"
      - "ui/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  STAGE: dev
  AWS_REGION: eu-west-3
  AMPLIFY_REGION: eu-west-3
  SLS_TELEMETRY_DISABLED: "1"
  NODE_OPTIONS: --max-old-space-size=4096


jobs:
  backend:
    name: Deploy Serverless backend
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # pour OIDC
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Node requis pour installer les plugins Serverless
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Installe le plugin déclaré dans package.json
      - name: Install Node deps (plugins Serverless)
        run: npm ci

      # Python requis par serverless-python-requirements
      - name: Setup Python (same as your Lambda runtime)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # (si tu utilises OIDC + un rôle IAM)
      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-3

      # Déploiement
      - name: Deploy with Serverless
        env:
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
        run: npx -y serverless@4 deploy --stage dev --region eu-west-3


jobs:
  backend:
    name: Deploy Serverless backend
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deploy with Serverless
        env:
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
          SLS_ORG: sorbonne
          SLS_APP: cancer-prediction-api
        run: |
          npx -y serverless@4 deploy --stage dev --region eu-west-3 \
          ${SLS_ORG:+--org "$SLS_ORG"} ${SLS_APP:+--app "$SLS_APP"}


      # 1) Calcule les "flags" à partir des secrets (PAS d'if avec secrets.*)
      - name: Compute auth flags
        id: flags
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          use_role=false
          use_keys=false
          if [ -n "${AWS_ROLE_ARN}" ]; then use_role=true; fi
          if [ -n "${AWS_ACCESS_KEY_ID}" ] && [ -n "${AWS_SECRET_ACCESS_KEY}" ]; then use_keys=true; fi
          echo "use_role=$use_role" >> "$GITHUB_OUTPUT"
          echo "use_keys=$use_keys" >> "$GITHUB_OUTPUT"

      # 2) Configure AWS (OIDC -> rôle)
      - name: Configure AWS (OIDC role)
        if: ${{ steps.flags.outputs.use_role == 'true' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 3) Configure AWS (clés d’accès)
      - name: Configure AWS (access keys)
        if: ${{ steps.flags.outputs.use_keys == 'true' && steps.flags.outputs.use_role != 'true' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

          # … étapes précédentes …

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
        node-version: '20'
        cache: 'npm'

      - name: Install Node deps (plugins Serverless)
        run: npm ci

       # le plugin utilise pip : alignez la version avec votre runtime Lambda
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Deploy with Serverless
        env:
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
        run: |
          npx -y serverless@4 deploy --stage dev --region eu-west-3

      - name: Deploy with Serverless
        run: |
          npx -y serverless@4 deploy \
            --stage "${{ env.STAGE }}" \
            --region "${{ env.AWS_REGION }}" \
            --verbose

  frontend:
    name: Trigger Amplify build
    needs: backend
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1) Calcule les flags (webhook / api / auth)
      - name: Compute Amplify flags
        id: flags
        env:
          AMPLIFY_WEBHOOK_URL: ${{ secrets.AMPLIFY_WEBHOOK_URL }}
          AMPLIFY_APP_ID:      ${{ secrets.AMPLIFY_APP_ID }}
          AMPLIFY_BRANCH:      ${{ secrets.AMPLIFY_BRANCH }}
          AWS_ROLE_ARN:        ${{ secrets.AWS_ROLE_ARN }}
          AWS_ACCESS_KEY_ID:   ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          have_webhook=false
          have_amplify_api=false
          use_role=false
          use_keys=false

          [ -n "${AMPLIFY_WEBHOOK_URL}" ] && have_webhook=true
          if [ -n "${AMPLIFY_APP_ID}" ] && [ -n "${AMPLIFY_BRANCH}" ]; then
            have_amplify_api=true
          fi
          [ -n "${AWS_ROLE_ARN}" ] && use_role=true
          if [ -n "${AWS_ACCESS_KEY_ID}" ] && [ -n "${AWS_SECRET_ACCESS_KEY}" ]; then
            use_keys=true
          fi

          echo "have_webhook=$have_webhook"   >> "$GITHUB_OUTPUT"
          echo "have_amplify_api=$have_amplify_api" >> "$GITHUB_OUTPUT"
          echo "use_role=$use_role"           >> "$GITHUB_OUTPUT"
          echo "use_keys=$use_keys"           >> "$GITHUB_OUTPUT"

      # 2) Méthode A : Webhook
      - name: Trigger Amplify via Webhook
        if: ${{ steps.flags.outputs.have_webhook == 'true' }}
        env:
          AMPLIFY_WEBHOOK_URL: ${{ secrets.AMPLIFY_WEBHOOK_URL }}
        run: |
          echo "Trigger Amplify via webhook…"
          curl -sS -X POST \
            -H "Content-Type: application/json" \
            -d '{"trigger":"github-actions","commit":"'"$GITHUB_SHA"'"}' \
            "${AMPLIFY_WEBHOOK_URL}"

      # 3) Si pas de webhook mais API dispo → configure AWS
      - name: Configure AWS (OIDC role)
        if: ${{ steps.flags.outputs.have_webhook != 'true' && steps.flags.outputs.have_amplify_api == 'true' && steps.flags.outputs.use_role == 'true' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AMPLIFY_REGION }}

      - name: Configure AWS (access keys)
        if: ${{ steps.flags.outputs.have_webhook != 'true' && steps.flags.outputs.have_amplify_api == 'true' && steps.flags.outputs.use_role != 'true' && steps.flags.outputs.use_keys == 'true' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AMPLIFY_REGION }}

      # 4) Méthode B : API Amplify (fallback)
      - name: Start Amplify RELEASE job
        id: start
        if: ${{ steps.flags.outputs.have_webhook != 'true' && steps.flags.outputs.have_amplify_api == 'true' }}
        env:
          AMPLIFY_APP_ID: ${{ secrets.AMPLIFY_APP_ID }}
          AMPLIFY_BRANCH: ${{ secrets.AMPLIFY_BRANCH }}
          AMPLIFY_REGION: ${{ env.AMPLIFY_REGION }}
        run: |
          echo "Starting Amplify RELEASE job on app ${AMPLIFY_APP_ID}, branch ${AMPLIFY_BRANCH}"
          JOB_JSON=$(aws amplify start-job \
            --region "${AMPLIFY_REGION}" \
            --app-id "${AMPLIFY_APP_ID}" \
            --branch-name "${AMPLIFY_BRANCH}" \
            --job-type RELEASE \
            --commit-id "${GITHUB_SHA}")
          echo "$JOB_JSON"
          JOB_ID=$(echo "$JOB_JSON" | jq -r '.jobSummary.jobId')
          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for Amplify job
        if: ${{ steps.start.outputs.job_id != '' }}
        env:
          AMPLIFY_APP_ID: ${{ secrets.AMPLIFY_APP_ID }}
          AMPLIFY_BRANCH: ${{ secrets.AMPLIFY_BRANCH }}
          AMPLIFY_REGION: ${{ env.AMPLIFY_REGION }}
          JOB_ID: ${{ steps.start.outputs.job_id }}
        run: |
          echo "Waiting Amplify job ${JOB_ID}…"
          for i in $(seq 1 120); do
            STATUS=$(aws amplify get-job \
              --region "${AMPLIFY_REGION}" \
              --app-id "${AMPLIFY_APP_ID}" \
              --branch-name "${AMPLIFY_BRANCH}" \
              --job-id "${JOB_ID}" \
              --query 'job.summary.status' --output text 2>/dev/null || echo "UNKNOWN")
            echo "[$i] status: $STATUS"
            case "$STATUS" in
              SUCCEED) exit 0 ;;
              FAILED|CANCELLED) echo "Amplify job failed ($STATUS)"; exit 1 ;;
            esac
            sleep 10
          done
          echo "Timeout waiting Amplify job"
          exit 1

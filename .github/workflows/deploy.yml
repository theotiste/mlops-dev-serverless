name: Deploy (Serverless v4 + static keys)

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Serverless stage (dev|prod)"
        default: "dev"
        required: true
      region:
        description: "AWS region"
        default: "eu-west-3"
        required: true
      api_base_url:
        description: "Optional base URL for smoke check (ex: https://api.mlopstheotiste.fr)"
        required: false
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ inputs.region || 'eu-west-3' }}
  STAGE: ${{ inputs.stage || 'dev' }}
  API_BASE_URL: ${{ inputs.api_base_url || vars.API_BASE_URL || '' }}
  TIMEOUT_S: 20

defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - nam

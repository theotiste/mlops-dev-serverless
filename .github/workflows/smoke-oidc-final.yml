name: Smoke (OIDC minimal)

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Base URL (ex: https://api.mlopstheotiste.fr)"
        required: false
      region:
        description: "AWS region"
        default: "eu-west-3"
        required: true
  schedule:
    - cron: "*/30 * * * *"    # toutes les 30 minutes

permissions:
  id-token: write
  contents: read

concurrency:
  group: smoke-oidc-${{ github.ref_name }}
  cancel-in-progress: true

env:
  # Inputs si run manuel, sinon variables du repo (Settings → Actions → Variables)
  API_BASE_URL: ${{ inputs.api_base_url || vars.API_BASE_URL }}
  AWS_REGION:   ${{ inputs.region     || vars.AWS_REGION   || 'eu-west-3' }}
  TIMEOUT_S: 20

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}   # arn:aws:iam::...:role/...
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Build payload
        run: |
          cat > payload.json <<'JSON'
          {"features":[14.5,20.1,95.5,700.0,0.10,0.11,0.08,0.05,0.18,0.060,0.50,1.10,3.50,40.0,0.006,0.020,0.025,0.010,0.020,0.003,16.5,22.1,110.0,900.0,0.13,0.18,0.20,0.12,0.28,0.08]}
          JSON

      - name: /health
        run: |
          set -euo pipefail
          test -n "$API_BASE_URL" || { echo "API_BASE_URL manquant"; exit 2; }
          curl -fsS -i --connect-timeout 10 --max-time $TIMEOUT_S \
            "$API_BASE_URL/health" | tee /tmp/health.txt
          grep -Eq '^HTTP/([0-9.]+) 200' /tmp/health.txt

      - name: /predict (SigV4)
        run: |
          set -euo pipefail
          HOST=$(echo "$API_BASE_URL" | sed -E 's#https?://([^/]+)/?.*#\1#')
          curl -fsS -i \
            --aws-sigv4 "aws:amz:${AWS_REGION}:execute-api" \
            -H "Host: $HOST" \
            -H "Content-Type: application/json" \
            --data-binary @payload.json \
            "$API_BASE_URL/predict" | tee /tmp/predict.txt
          grep -Eq '^HTTP/([0-9.]+) 200' /tmp/predict.txt

      - name: Notify Slack on failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}   # optionnel
        run: |
          MSG="❌ Smoke OIDC failed on $GITHUB_REPOSITORY ($GITHUB_REF). Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl -sS -X POST -H "Content-type: application/json" \
            --data "{\"text\":\"$MSG\"}" "$SLACK_WEBHOOK_URL" >/dev/null

name: Frontend · UI → S3 + CloudFront

on:
  workflow_dispatch:
    inputs:
      region: { description: "AWS region", default: "eu-west-3", required: true }
  push:
    branches: [ "main" ]
    paths:
      - "ui/**"
      - "index.html"

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref_name }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ inputs.region || secrets.AWS_REGION }}
  UI_BUCKET:  ${{ secrets.UI_BUCKET }}
  UI_BASE:    ${{ secrets.UI_BASE }} # tu l'as en secret, on le traite comme préfixe optionnel
  CF_DISTR_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Build SPA si ui/package.json existe
      - name: Use Node.js (UI)
        if: hashFiles('ui/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Build UI
        if: hashFiles('ui/package.json') != ''
        working-directory: ui
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm i; fi
          npm run build
          if   [ -d build ]; then echo "BUILD_DIR=ui/build" >> $GITHUB_ENV
          elif [ -d dist  ]; then echo "BUILD_DIR=ui/dist"  >> $GITHUB_ENV
          else echo "BUILD_DIR=ui" >> $GITHUB_ENV; fi

      - name: Dossier à publier (site statique simple)
        if: hashFiles('ui/package.json') == ''
        run: echo "BUILD_DIR=ui" >> $GITHUB_ENV

      - name: Configure AWS (static keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Sync vers S3
        env:
          DEST: s3://${{ env.UI_BUCKET }}${{ env.UI_BASE != '' && format('/{0}', env.UI_BASE) || '' }}
        run: |
          set -euo pipefail
          echo "DEST=$DEST"
          # 1) assets (cache long)
          aws s3 sync "$BUILD_DIR/" "$DEST/" \
            --delete --exclude "index.html" \
            --cache-control "public,max-age=31536000,immutable"
          # 2) index.html (no-cache)
          if [ -f "$BUILD_DIR/index.html" ]; then
            aws s3 cp "$BUILD_DIR/index.html" "$DEST/index.html" \
              --cache-control "no-cache, no-store, must-revalidate"
          fi

      - name: Invalidation CloudFront (si ID fourni)
        run: |
          set -euo pipefail
          if [ -n "${CF_DISTR_ID:-}" ]; then
            aws cloudfront create-invalidation \
              --distribution-id "${CF_DISTR_ID}" \
              --paths "/*"
          else
            echo "CF_DISTR_ID vide → pas d'invalidation."
          fi

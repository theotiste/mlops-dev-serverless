name: Backend · Serverless v4 (static keys)

on:
  workflow_dispatch:
    inputs:
      region:
        description: "AWS region"
        default: eu-west-3
        required: true
  push:
    branches: [ main ]
    paths:
      - "serverless.yml"
      - "serverless.yaml"
      - "handler.py"
      - "functions/**"
      - "model-layer/**"
      - "requirements.txt"
      - "scripts/**"
      - "!ui/**"           # ignore le frontend

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref_name }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ github.event.inputs.region || secrets.AWS_REGION }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ inputs.region || secrets.AWS_REGION }}
      SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js (for Serverless)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python (build deps)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Serverless v4
        run: npm i -g serverless@^4

      - name: Install project dependencies (plugins, etc.)
        run: |
          if [ -f package-lock.json ]; then npm ci; elif [ -f package.json ]; then npm i; fi

      - name: Configure AWS (static keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Check Serverless auth
        run: |
          if [ -z "${SERVERLESS_ACCESS_KEY:-}" ]; then
           echo "::error::SERVERLESS_ACCESS_KEY is empty"
           exit 1
          fi
          npx serverless --version
   

      - name: Deploy (Serverless v4)
        run: |
          set -euo pipefail
          serverless deploy --stage "${{ secrets.API_STAGE || 'dev' }}" --region "${AWS_REGION}"

      - name: Slack · notify
        if: ${{ always() }}
         continue-on-error:true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
        run: |
          set -euo pipefail

          # 1) Absent ? on sort proprement
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "No SLACK_WEBHOOK_URL, skipping Slack notification."
            exit 0
          fi

          # 2) Nettoyage (quotes/copier-coller, CRLF)
          WEBHOOK="$(printf '%s' "$SLACK_WEBHOOK_URL" | tr -d '\r' | sed 's/^"\|"$//g')"

          # 3) Validation simple
          case "$WEBHOOK" in
            https://hooks.slack.com/*) : ;;
            *) echo "Webhook doesn't look like a Slack URL, skipping."; exit 0 ;;
          esac

          # 4) Message
          icon=":white_check_mark:"
          [ "${STATUS}" = "success" ] || icon=":x:"
          msg="$icon ${GITHUB_WORKFLOW} ${STATUS} (#${GITHUB_RUN_NUMBER}) – ${GITHUB_REF_NAME}"

          # 5) Envoi (ne casse pas le job si Slack refuse)
          curl -sS -X POST -H 'Content-type: application/json' \
             --data "{\"text\":\"${msg}\"}" \
             "$WEBHOOK" || echo "Slack notify failed (ignored)."
    

    

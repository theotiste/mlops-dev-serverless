name: Deploy backend (Serverless v4 + static keys)

on:
  workflow_dispatch:
    inputs:
      stage:  { description: "dev|prod", default: "dev", required: true }
      region: { description: "AWS region",  default: "eu-west-3", required: true }
  push:
    branches: [ "main" ]
    paths:
      # back uniquement
      - "serverless.yml"
      - "serverless.yaml"
      - "handler.py"
      - "requirements.txt"
      - "model-layer/**"
      - "schemas/**"
      - "scripts/**"
      - "**/*.py"
      # npm plugins/lock (sans ui)
      - "package.json"
      - "package-lock.json"
      - "!ui/**"

permissions:
  contents: read

concurrency:
  group: deploy-backend-${{ github.ref_name }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ inputs.region || vars.AWS_REGION || 'eu-west-3' }}
  STAGE:      ${{ inputs.stage  || vars.STAGE      || 'dev' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Serverless (v4)
        run: |
          npm i -g serverless@4
          serverless --version

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm i; fi
          python -m pip install --upgrade pip wheel setuptools

      - name: Configure AWS credentials (static keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Deploy (Serverless v4)
        env:
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }} # si tu utilises le Dashboard v4
          SLS_ORG: ${{ vars.SLS_ORG }}   # optionnel si défini dans serverless.yml
          SLS_APP: ${{ vars.SLS_APP }}   # optionnel
        run: |
          set -euo pipefail
          EXTRA=""
          [ -n "${SLS_ORG:-}" ] && EXTRA="$EXTRA --org ${SLS_ORG}"
          [ -n "${SLS_APP:-}" ] && EXTRA="$EXTRA --app ${SLS_APP}"
          serverless deploy --stage "$STAGE" --region "$AWS_REGION" $EXTRA
          serverless info   --stage "$STAGE" --region "$AWS_REGION" $EXTRA

      # (facultatif) Sanity /health si tu as un domaine custom en variable
      - name: Health check
        if: ${{ vars.API_BASE_URL != '' }}
        run: |
          curl -fsS -i "${{ vars.API_BASE_URL }}/health" | tee /tmp/health.txt
          grep -Eq '^HTTP/([0-9.]+) 200' /tmp/health.txt

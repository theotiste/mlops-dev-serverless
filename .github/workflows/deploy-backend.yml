name: Backend · Serverless v4 (static keys)

on:
  workflow_dispatch:
    inputs:
      region:
        description: "AWS region"
        default: eu-west-3
        required: true
  push:
    branches: [ main ]
    paths:
      - "serverless.yml"
      - "serverless.yaml"
      - "handler.py"
      - "functions/**"
      - "model-layer/**"
      - "requirements.txt"
      - "scripts/**"
      - "!ui/**"           # ignore le frontend

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref_name }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ github.event.inputs.region || secrets.AWS_REGION }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js (for Serverless)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python (build deps)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Serverless v4
        run: npm i -g serverless@^4

      - name: Install project dependencies (plugins, etc.)
        run: |
          if [ -f package-lock.json ]; then npm ci; elif [ -f package.json ]; then npm i; fi

      - name: Configure AWS (static keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Deploy (Serverless v4)
        run: |
          set -euo pipefail
          serverless deploy --stage "${{ secrets.API_STAGE || 'dev' }}" --region "${AWS_REGION}"

      - name: Slack · notify
        if: ${{ always() }}
        env:
          STATUS: ${{ job.status }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "No SLACK_WEBHOOK_URL, skipping Slack notification."
            exit 0
          fi
          icon=":white_check_mark:"; [ "$STATUS" = "success" ] || icon=":x:"
          msg="$icon Backend $STATUS (#$GITHUB_RUN_NUMBER) – $GITHUB_REF_NAME"
          curl -sS -X POST -H 'Content-type: application/json' \
               --data "{\"text\":\"${msg}\"}" \
               "$SLACK_WEBHOOK_URL"

service: cancer-prediction-api
frameworkVersion: '4'
configValidationMode: error

provider:
  name: aws
  runtime: python3.12
  region: ${opt:region, 'eu-west-3'}
  stage: ${opt:stage, 'dev'}
  architecture: x86_64
  memorySize: 512
  timeout: 28

  # ✅ v4 : retention pour les log groups Lambda
  logRetentionInDays: 14

  # Logs API Gateway (facultatif)
  logs:
    restApi: true

  environment:
    APP_STAGE: ${self:provider.stage}   # ne pas utiliser de variables AWS_*

plugins:
  - serverless-python-requirements
  - serverless-prune-plugin

custom:
  allowedOrigins:
    - https://form.mlopstheotiste.fr
    - https://dbc4cwxk7wl7p.cloudfront.net

  pythonRequirements:
    layer: true
    slim: true
    strip: true
    zip: true
    dockerizePip: true
    useStaticCache: true
    useDownloadCache: true
    invalidateCaches: true
    noDeploy:
      - boto3
      - botocore
      - s3transfer
      - setuptools
      - pip
      - wheel
      - jmespath
      - urllib3
      - python-dateutil
      - certifi
      - idna
      - chardet
      - docutils

  prune:
    automatic: true
    number: 3

package:
  individually: true
  patterns:
    - '!**/.git/**'
    - '!**/__pycache__/**'
    - '!**/*.pyc'
    - '!**/.pytest_cache/**'
    - '!tests/**'
    - '!scripts/**'
    - '!ui/**'
    - '!node_modules/**'
    - '!venv/**'
    - '!slim-venv/**'
    - '!.serverless/**'

functions:
  health:
    name: ${self:service}-${self:provider.stage}-health
    handler: handler.health
    memorySize: 128
    timeout: 5
    package:
      patterns:
        - '!**/*'
        - handler.py
        - index.html
    events:
      - http:
          path: health
          method: get
          cors: true

  predict:
    name: ${self:service}-${self:provider.stage}-predict
    handler: handler.predict
    memorySize: 2048
    timeout: 28
    package:
      patterns:
        - '!**/*'
        - handler.py
        - RandomForest.pkl
        - schemas/**         # si utilisé
        - payload.json        # si utilisé par vos tests
        - features_input.json # si utilisé par vos tests

    events:
      - http:
          path: predict
          method: post
          cors:
            origins:
              - https://form.mlopstheotiste.fr
              - https://dbc4cwxk7w17p.cloudfront.net
            headers:
              - Content-Type
            allowCredentials: false 
    

outputs:
  ServiceEndpoint:
    Description: Base URL
    Value:
      Fn::Join:
        - ''
        - - https://
          - Ref: ApiGatewayRestApi
          - .execute-api.
          - Ref: AWS::Region
          - .amazonaws.com/
          - ${self:provider.stage}

  HealthUrl:
    Description: Healthcheck URL
    Value:
      Fn::Join:
        - ''
        - - https://
          - Ref: ApiGatewayRestApi
          - .execute-api.
          - Ref: AWS::Region
          - .amazonaws.com/
          - ${self:provider.stage}
          - /health

  PredictUrl:
    Description: Predict URL
    Value:
      Fn::Join:
        - ''
        - - https://
          - Ref: ApiGatewayRestApi
          - .execute-api.
          - Ref: AWS::Region
          - .amazonaws.com/
          - ${self:provider.stage}
          - /predict

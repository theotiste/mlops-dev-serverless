service: cancer-prediction-api
frameworkVersion: '4'

provider:
  name: aws
  runtime: python3.11
  region: ${env:AWS_REGION, 'eu-west-3'}
  stage:  ${env:STAGE, 'dev'}
  memorySize: 256
  timeout: 30
  logs:
    restApi: true

plugins:
  - serverless-python-requirements
  - serverless-prune-plugin

custom:
  pythonRequirements:
    slim: true
    useStaticCache: true
    useDownloadCache: true
    invalidateCaches: false
  prune:
    automatic: true
    number: 3

# ⚠️ IMPORTANT : on inclut explicitement les sources nécessaires
# (ajuste les chemins si tes dossiers/fichiers se nomment autrement)
package:
  individually: true
  patterns:
    # INCLUDES (positifs) – au moins un doit correspondre !
    - handler.py
    - model-layer/**           # ton code modèle
    - schemas/**               # tes schémas / data
    - requirements.txt
    - .requirements/**         # ajouté par serverless-python-requirements

    # EXCLUDES (négatifs)
    - '!ui/**'
    - '!.git/**'
    - '!.venv/**'
    - '!node_modules/**'
    - '!**/__pycache__/**'
    - '!**/*.pyc'
    - '!**/*.pyo'
    - '!tests/**'
    - '!README.md'
    - '!package-lock.json'
    - '!package.json'          # pas utile dans la Lambda Python

functions:
  health:
    handler: handler.health
    events:
      - http:
          path: health
          method: get
          cors: true

  predict:
    handler: handler.predict
    events:
      - http:
          path: predict
          method: post
          cors:
            origins:
              - https://form.mlopstheotiste.fr
              - https://dbc4cwxk7wl7p.cloudfront.net
            headers:
              - Content-Type
            allowCredentials: false

# Sorties pratiques
outputs:
  ServiceEndpoint:
    Description: Base URL
    Value:
      Fn::Join:
        - ''
        - - https://
          - Ref: ApiGatewayRestApi
          - .execute-api.
          - Ref: AWS::Region
          - .amazonaws.com/
          - ${self:provider.stage}

  HealthUrl:
    Description: Healthcheck URL
    Value:
      Fn::Join:
        - ''
        - - https://
          - Ref: ApiGatewayRestApi
          - .execute-api.
          - Ref: AWS::Region
          - .amazonaws.com/
          - ${self:provider.stage}
          - /health

  PredictUrl:
    Description: Predict URL
    Value:
      Fn::Join:
        - ''
        - - https://
          - Ref: ApiGatewayRestApi
          - .execute-api.
          - Ref: AWS::Region
          - .amazonaws.com/
          - ${self:provider.stage}
          - /predict

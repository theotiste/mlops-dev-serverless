service: cancer-prediction-api

frameworkVersion: '4'   # compatible v4

provider:
  name: aws
  region: ${opt:region, 'eu-west-3'}
  stage: ${opt:stage, 'dev'}
  runtime: python3.12
  architecture: arm64
  memorySize: 512
  timeout: 30
  deploymentBucket:
    blockPublicAccess: true
  # IMPORTANT : ne pas activer logs.restApi ici pour éviter le conflit de rôle CloudWatch d’API Gateway
  logs:
    restApi: false

  iam:
    role:
      statements:
        # CloudWatch Logs (au cas où, sinon la managed policy par défaut suffit la plupart du temps)
        - Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
          Resource: arn:aws:logs:${self:provider.region}:*:*

package:
  individually: true
  # Pas de patterns ici pour éviter l’erreur “No file matches include / exclude patterns”.
  # Le plugin requirements met les libs dans une layer dédiée, ce qui garde les zips de fonctions petits.

plugins:
  - serverless-python-requirements
  - serverless-prune-plugin

custom:
  pythonRequirements:
    dockerizePip: true       # évite d’avoir Python installé en CI
    layer: true              # les dépendances vont dans une Lambda Layer auto-générée
    slim: true               # supprime fichiers inutiles dans les wheels
    zip: true                # compresse la layer
    useStaticCache: true
    useDownloadCache: true
    # Si tu utilises des wheels précompilés: pipCmdExtraArgs: ['--only-binary=:all:']

  prune:
    automatic: true
    number: 3

functions:
  health:
    handler: handler.health
    events:
      - http:
          path: health
          method: get
          cors: true

  predict:
    handler: handler.predict
    # On attache la layer auto du plugin (pas de layer custom tant que non nécessaire)
    layers:
      - { Ref: PythonRequirementsLambdaLayer }
    events:
      - http:
          path: predict
          method: post
          cors:
            origins:
              - https://form.mlopstheotiste.fr
              - https://dbc4cwxk7wl7p.cloudfront.net
            headers:
              - Content-Type
            allowCredentials: false

# Sorties CloudFormation pratiques
outputs:
  ServiceEndpoint:
    Description: Base URL
    Value:
      Fn::Join:
        - ''
        - - https://
          - Ref: ApiGatewayRestApi
          - .execute-api.
          - Ref: AWS::Region
          - .amazonaws.com/
          - ${self:provider.stage}

  HealthUrl:
    Description: Healthcheck URL
    Value:
      Fn::Join:
        - ''
        - - https://
          - Ref: ApiGatewayRestApi
          - .execute-api.
          - Ref: AWS::Region
          - .amazonaws.com/
          - ${self:provider.stage}
          - /health

  PredictUrl:
    Description: Predict URL
    Value:
      Fn::Join:
        - ''
        - - https://
          - Ref: ApiGatewayRestApi
          - .execute-api.
          - Ref: AWS::Region
          - .amazonaws.com/
          - ${self:provider.stage}
          - /predict

service: cancer-prediction-api

frameworkVersion: ">=4.0.0 <5.0.0"

plugins:
  - serverless-python-requirements
  - serverless-prune-plugin

provider:
  name: aws
  runtime: python3.12
  architecture: x86_64        # évite les surprises côté image de build
  stage: ${opt:stage, env:STAGE, 'dev'}
  region: ${opt:region, env:AWS_REGION, 'eu-west-3'}
  memorySize: 256
  # timeout par défaut (chaque fonction peut override)
  timeout: 10
  environment:
    STAGE: ${self:provider.stage}
    AWS_REGION: ${self:provider.region}
  # Ne pas activer les logs REST API ici pour éviter les conflits "custom apigw cw role"
  # logs:
  #   restApi: true

package:
  individually: true

custom:
  # Génère une Lambda Layer avec les libs Python
  pythonRequirements:
    dockerizePip: true         # build dans une image compatible Lambda
    layer: true                # crée la Layer automatiquement
    slim: true                 # supprime fichiers inutiles (tests, .pyc…)
    strip: true                # strip des binaires
    zip: true                  # compresse la layer
    invalidateCaches: true
    noDeploy:                  # libs déjà présentes sur l'environnement Lambda
      - boto3
      - botocore
      - s3transfer
      - urllib3
      - jmespath
      - docutils

  # Nettoie les anciennes versions après déploiement
  prune:
    automatic: true
    number: 3

functions:
  health:
    handler: handler.health
    timeout: 6
    # paquet minimal : n’embarque que ce qui est nécessaire
    package:
      patterns:
        - '!**/*'
        - 'handler.py'
    events:
      - http:
          path: health
          method: get
          cors: true

  predict:
    handler: handler.predict
    timeout: 30                   # API Gateway a ~29s, donc max 30 ici
    # ATTACHE UNIQUEMENT LA LAYER PYTHON ICI
    layers:
      - { Ref: PythonRequirementsLambdaLayer }
    package:
      patterns:
        - '!**/*'
        - 'handler.py'
        - 'schemas/**'            # <-- ajuste selon ton repo
        - 'model-layer/**'        # <-- si tu gardes le modèle dans le code
        # ajoute d'autres dossiers/fichiers nécessaires si besoin
    events:
      - http:
          path: predict
          method: post
          cors:
            origins:
              - https://form.mlopstheotiste.fr
              - https://dbc4cwxk7wl7p.cloudfront.net
            headers:
              - Content-Type
            allowCredentials: false

# Sorties pratiques (URLs)
outputs:
  ServiceEndpoint:
    Description: Base URL
    Value:
      Fn::Join:
        - ''
        - - https://
          - Ref: ApiGatewayRestApi
          - .execute-api.
          - Ref: AWS::Region
          - .amazonaws.com/
          - ${self:provider.stage}

  HealthUrl:
    Description: Healthcheck URL
    Value:
      Fn::Join:
        - ''
        - - https://
          - Ref: ApiGatewayRestApi
          - .execute-api.
          - Ref: AWS::Region
          - .amazonaws.com/
          - ${self:provider.stage}
          - /health

  PredictUrl:
    Description: Predict URL
    Value:
      Fn::Join:
        - ''
        - - https://
          - Ref: ApiGatewayRestApi
          - .execute-api.
          - Ref: AWS::Region
          - .amazonaws.com/
          - ${self:provider.stage}
          - /predict

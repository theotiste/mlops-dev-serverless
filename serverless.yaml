service: cancer-prediction-api
frameworkVersion: '4'

provider:
  name: aws
  runtime: python3.11
  region: ${env:AWS_REGION, 'eu-west-3'}
  stage: ${env:STAGE, 'dev'}
  memorySize: 256
  timeout: 30
  logRetentionInDays: 14

plugins:
  - serverless-python-requirements
  - serverless-prune-plugin

custom:
  prune:
    automatic: true
    number: 3
  pythonRequirements:
    slim: true
    noDeploy:
      - boto3
      - botocore

# 1) sécurité : on inclut « tout » puis on filtre les évidents inutiles
package:
  individually: true
  patterns:
    - '**/*'
    - '!node_modules/**'
    - '!venv/**'
    - '!**/__pycache__/**'
    - '!tests/**'
    - '!.git/**'
    - '!**/*.pyc'

functions:
  health:
    handler: handler.health
    events:
      - httpApi:
          method: GET
          path: /health
    package:
      patterns:
        - '!**/*'
        - 'handler.py'
        - 'schemas/**'

  predict:
    handler: handler.predict
    events:
      - httpApi:
          method: POST
          path: /predict
    layers:
      - { Ref: ModelLayerLambdaLayer }
    package:
      patterns:
        - '!**/*'
        - 'handler.py'
        - 'schemas/**'
        - 'model-layer/**'

layers:
  modelLayer:
    path: model-layer
    name: ${self:service}-${sls:stage}-model
    compatibleRuntimes:
      - python3.11
    package:
      patterns:
        - '!**/*'
        - 'model-layer/**'
        - '!**/__pycache__/**'
        - '!tests/**'

resources:
  Outputs:
    ServiceEndpoint:
      Description: API base URL
      Value:
        Fn::Join:
          - ''
          - - 'https://'
            - Ref: ApiGatewayRestApi
            - '.execute-api.'
            - Ref: AWS::Region
            - '.amazonaws.com/'
            - ${sls:stage}
    HealthUrl:
      Description: Healthcheck URL
      Value:
        Fn::Join:
          - ''
          - - 'https://'
            - Ref: ApiGatewayRestApi
            - '.execute-api.'
            - Ref: AWS::Region
            - '.amazonaws.com/'
            - ${sls:stage}
            - '/health'
    PredictUrl:
      Description: Predict URL
      Value:
        Fn::Join:
          - ''
          - - 'https://'
            - Ref: ApiGatewayRestApi
            - '.execute-api.'
            - Ref: AWS::Region
            - '.amazonaws.com/'
            - ${sls:stage}
            - '/predict'

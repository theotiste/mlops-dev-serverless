service: cancer-prediction-api-dev

frameworkVersion: "4"   # vous êtes sur SLS v4.x

provider:
  name: aws
  runtime: python3.12
  region: eu-west-3
  stage: dev
  memorySize: 2048
  timeout: 28
  architecture: x86_64
  # On fige les variables d'env utilisées par le handler
  environment:
    S3_BUCKET: mlopstheotiste-bucket
    S3_KEY: models/RandomForest.pkl
    # Permet de forcer un refresh du modèle si besoin (changez la valeur)
    MODEL_CACHE_BUSTER: "1758630221"

  # Permissions minimales pour lire le modèle dans S3
  iam:
    role:
      statements:
        - Sid: ListModelsPrefix
          Effect: Allow
          Action:
            - s3:ListBucket
          Resource: arn:aws:s3:::mlopstheotiste-bucket
          Condition:
            StringLike:
              s3:prefix: "models/*"
        - Sid: ReadModelObjects
          Effect: Allow
          Action:
            - s3:GetObject
            - s3:GetObjectAttributes
            - s3:HeadObject
          Resource: arn:aws:s3:::mlopstheotiste-bucket/models/*

  # On fige le layer créé (sklearn + numpy)
  layers:
    - arn:aws:lambda:eu-west-3:571600829584:layer:sklearn-numpy-py312:1

  httpApi:
    cors:
      allowedOrigins:
        - "*" # ou remplacez par https://form.mlopstheotiste.fr
      allowedHeaders:
        - Content-Type
      allowedMethods:
        - POST
        - GET

package:
  # On s'assure de ne déployer que le strict nécessaire
  patterns:
    - handler.py
    - '!**/*'
    - '!.git/**'
    - '!node_modules/**'
    - '!venv/**'
    - '!__pycache__/**'

functions:
  predict:
    handler: handler.predict
    layers:
      - arn:aws:lambda:eu-west-3:571600829584:layer:sklearn-numpy-py312:1
    events:
      - httpApi:
          method: POST
          path: /predict

  health:
    handler: handler.health
    events:
      - httpApi:
          method: GET
          path: /health

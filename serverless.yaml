service: cancer-prediction-api
frameworkVersion: "4"

provider:
  name: aws
  runtime: python3.12
  # ✅ on lit la région depuis l'env CI/CD mais on NE l'injecte PAS dans l'env Lambda
  region: ${env:AWS_REGION, 'eu-west-3'}
  stage: ${env:STAGE, 'dev'}

  # API Gateway timeouts ~29s -> évite 30s côté Lambda
  timeout: 28
  memorySize: 512
  architecture: x86_64   # évite les images arm64 côté CI; mets "arm64" si tu le souhaites

  logs:
    http: true

  # ✅ PAS de variables réservées (AWS_REGION, AWS_DEFAULT_REGION, LAMBDA_*)
  environment:
    STAGE: ${sls:stage}
    REGION_ALIAS: ${aws:region}  # si ton code veut une variable lisible côté Lambda

# ---- Plugins ---------------------------------------------------------------
plugins:
  - serverless-python-requirements
  - serverless-prune-plugin

custom:
  # Réduit la taille et met les deps Python dans une couche dédiée
  pythonRequirements:
    pythonBin: python3.12
    dockerizePip: true
    useStaticCache: true
    invalidateCaches: true
    slim: true
    strip: true
    layer: true          # crée automatiquement PythonRequirementsLambdaLayer

  # Garde un historique raisonnable des versions déployées
  prune:
    automatic: true
    number: 5

# ---- Packaging global (léger et prédictible) -------------------------------
package:
  individually: true
  patterns:
    # Include : code Python + schémas
    - "**/*.py"
    - "schemas/**"
    # Exclude : tout ce qui est inutile/volumineux
    - "!node_modules/**"
    - "!venv/**"
    - "!**/__pycache__/**"
    - "!tests/**"
    - "!ui/**"
    - "!.git/**"
    - "!**/*.md"
    - "!sls.out.yml"
    - "!model-layer/**"   # si tu as un layer maison séparé

# ---- Fonctions -------------------------------------------------------------
functions:
  health:
    handler: handler.health
    timeout: 5
    memorySize: 256
    layers:
      - { Ref: PythonRequirementsLambdaLayer }
    events:
      - http:
          path: health
          method: get
          cors: true

  predict:
    handler: handler.predict
    timeout: 28
    memorySize: 1024
    layers:
      - { Ref: PythonRequirementsLambdaLayer }
    events:
      - http:
          path: predict
          method: post
          cors:
            origins:
              - https://form.mlopstheotiste.fr
              - https://dbc4cwxk7wl7p.cloudfront.net
            headers:
              - Content-Type
            allowCredentials: false

# ---- Sorties pratiques (CloudFormation Outputs) ---------------------------
outputs:
  ServiceEndpoint:
    Description: Base URL
    Value:
      Fn::Join:
        - ""
        - - https://
          - Ref: ApiGatewayRestApi
          - .execute-api.
          - Ref: AWS::Region
          - .amazonaws.com/
          - ${self:provider.stage}

  HealthUrl:
    Description: Healthcheck URL
    Value:
      Fn::Join:
        - ""
        - - https://
          - Ref: ApiGatewayRestApi
          - .execute-api.
          - Ref: AWS::Region
          - .amazonaws.com/
          - ${self:provider.stage}
          - /health

  PredictUrl:
    Description: Predict URL
    Value:
      Fn::Join:
        - ""
        - - https://
          - Ref: ApiGatewayRestApi
          - .execute-api.
          - Ref: AWS::Region
          - .amazonaws.com/
          - ${self:provider.stage}
          - /predict

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Résultat de la prédiction</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { --bg:#f5f7fb; --card:#fff; --text:#0f172a; --muted:#64748b; --danger:#ef4444; --ok:#16a34a; --primary:#2563eb; }
    *{box-sizing:border-box}
    body{margin:0;padding:40px;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    h1{text-align:center;margin-bottom:24px}
    .card{max-width:900px;margin:0 auto;background:var(--card);padding:24px;border-radius:14px;box-shadow:0 8px 30px rgba(2,6,23,.08);text-align:center}
    .pill{display:inline-block;padding:12px 18px;border-radius:999px;font-weight:700;margin:18px 0}
    .pill.red{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}
    .pill.green{background:#dcfce7;color:#166534;border:1px solid #bbf7d0}
    .actions{display:flex;gap:12px;justify-content:center;margin-top:22px;flex-wrap:wrap}
    .btn{border:none;background:var(--primary);color:#fff;padding:10px 16px;border-radius:10px;cursor:pointer;text-decoration:none}
    .btn.secondary{background:#e2e8f0;color:#111827}
    .muted{color:var(--muted)}
  </style>
</head>
<body>
  <h1>Résultat de la prédiction</h1>
  <div class="card">
    <div id="pill" class="pill">—</div>
    <p class="muted" id="raw"></p>
    <p class="muted" id="conf"></p>

    <div class="actions">
      <a class="btn" href="/form_validated.html">Revenir au formulaire</a>
      <button class="btn secondary" id="refresh">Rafraîchir</button>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const pred  = Number(params.get("prediction"));              // 0 ou 1 (ou autre numérique)
    const proba = params.has("proba") ? Number(params.get("proba")) : null; // [0..1] si présent

    const pill = document.getElementById("pill");
    const raw  = document.getElementById("raw");
    const conf = document.getElementById("conf");

    // Affichage du badge (selon pred)
    const isMalignant = Number.isFinite(pred) && pred >= 1; // >=1 -> "maligne"
    pill.textContent = isMalignant ? "Tumeur maligne (1)" : "Tumeur bénigne (0)";
    pill.className = "pill " + (isMalignant ? "red" : "green");

    // Lignes d'information
    raw.textContent = `Valeur reçue (prediction) : ${Number.isFinite(pred) ? pred : "—"}`;

    // Pourcentage “propre” (1 décimale). Évite d’afficher 100.0% si proba=0.999999
    let pctStr = "—";
    if (typeof proba === "number" && !Number.isNaN(proba)) {
      const rawPct = proba * 100;
      const pct = (rawPct < 100) ? Math.min(99.9, +rawPct.toFixed(1)) : 100.0;
      pctStr = `${pct.toFixed(1)} %`;

      // Commentaire de confiance
      let note = "";
      if      (pct >= 99.5) note = "Très forte probabilité";
      else if (pct >= 90)   note = "Forte probabilité";
      else if (pct >= 70)   note = "Probabilité élevée";
      else if (pct >= 50)   note = "Probabilité modérée";
      else                  note = "Probabilité faible";

      conf.textContent = `Probabilité (classe 1) : ${pctStr} — ${note}`;
    } else {
      conf.textContent = "Probabilité non fournie par l'API.";
    }

    document.getElementById("refresh").addEventListener("click", () => location.reload());
  </script>
</body>
</html>
